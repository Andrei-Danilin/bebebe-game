# SPEC-023: the balance report on GitHub (npm run balance: every level with the autopilot in sim mode).
# Start: gh workflow run balance.yml -f ref=<branch>
#        gh run list --workflow balance.yml --limit 5 --json databaseId,displayTitle,createdAt
#          → the run titled "Balance <branch>" (run-name below) with createdAt after the dispatch
#        gh run watch <id> --exit-status               → gh run download <id> -n balance -D reports
# and commit reports/balance.md + reports/balance.json on the branch.
# workflow_dispatch works only once this file is on the default branch (master); a push that changes this file on a
# spec branch also runs it (that is how SPEC-023 tried it before the merge).
name: Balance
run-name: Balance ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to make the report for"
        required: true
        default: master
  push:
    branches: ["SPEC-*"]
    paths: [".github/workflows/balance.yml"]

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # CI 45957040604: the runner's packages.microsoft.com apt source answered 403 and failed `apt-get update`; the browser's libraries
      # come from Ubuntu's own archive, so every other source list is removed first (same step as tests.yml)
      - name: Drop the runner's third-party apt sources (only Ubuntu's are needed)
        run: |
          shopt -s nullglob
          for f in /etc/apt/sources.list.d/*; do
            case "$(basename "$f")" in ubuntu*) ;; *) sudo rm -f "$f" ;; esac
          done
          true
      - name: Install Chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the system libraries (browsers from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run balance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balance
          path: |
            reports/balance.md
            reports/balance.json
          retention-days: 14
