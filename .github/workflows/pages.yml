# Tests (the sharded jobs of tests.yml, SPEC-023), then publishes the game on GitHub Pages (SPEC-001).
# A red deploy with green tests: start a fresh run (gh workflow run pages.yml --ref master), never gh run rerun --failed
# (it uploads a second github-pages artifact).
# Only the site files go to Pages: index.html, manifest.webmanifest, sw.js, icons/, v1-2d/.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # SPEC-023: the same 4 sharded test jobs as on spec branches (tests.yml), then the deploy
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons v1-2d _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
