# SPEC-023: the whole Playwright suite in 4 parallel shards (SPEC-011: plus one lint job).
# - on every push of a spec branch (SPEC-*): the orchestrator merges only when this run is green;
# - by hand (workflow_dispatch);
# - from pages.yml (workflow_call) before every deploy of master.
# Each shard writes a blob report; the `report` job merges them into one HTML report (artifact `html-report`) and fails
# when a shard failed. A failing shard also uploads its test-results/ (error context, failure screenshots) as
# `test-results-<shard>` (error context + failure screenshots; no traces are recorded). On CI the browser draws with SwiftShader (tests/test-env.js: process.env.CI).
name: Tests

on:
  push:
    branches: ["SPEC-*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push of the same spec branch cancels the older run. Called from pages.yml (workflow_call) github.workflow is the
# caller's name ("Pages") and github.event_name its event ("push"), so such runs get their own group per run and are never
# cancelled here (pages.yml has its own `pages` group).
concurrency:
  group: ${{ github.workflow == 'Tests' && format('tests-{0}', github.ref) || format('tests-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.workflow == 'Tests' && github.event_name == 'push' }}

jobs:
  # SPEC-011 AC 11b: ESLint (npm run lint = scripts/lint.js) once per run, beside the shards; a lint error fails the run
  # (and, called from pages.yml, blocks the deploy)
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the system libraries (browsers from the cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run shard ${{ matrix.shard }}/4
        run: npx playwright test --shard ${{ matrix.shard }}/4 --reporter=blob,dot
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          overwrite: true

  report:
    name: merge reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html,github ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: playwright-report/
          retention-days: 14
      - name: Fail when a shard failed
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "a test shard failed: ${{ needs.test.result }}"
          exit 1
