function artSettle(a, ok) {
  if (a.state !== "loading") return;
  a.state = ok ? "ok" : "bad";
  if (ok) artVersion++;
  if (!a.own) { artCount[ok ? "ok" : "bad"]++; artProgress(); }
}
function artFetch(a, src, then) {
  try {
    const img = a.img = new Image();
    img.src = src;
    const done = ok => { artSettle(a, ok); if (then) then(ok); };
    if (img.decode) img.decode().then(() => done(true), () => done(false));
    else { img.onload = () => done(true); img.onerror = () => done(false); }
  } catch (e) { artSettle(a, false); if (then) then(false); }

function artLoad() {
  if (artStarted) return;
  artStarted = true;
  const probe = artImgs.get("logo");
  artFetch(probe, LOOK.ART.dir + "logo.webp", ok => {
    for (const [name, a] of artImgs) {
      if (a.own || a.img) continue;
      if (ok) artFetch(a, LOOK.ART.dir + name + ".webp"); else artSettle(a, false);

  });
}

    get textSizes() { return { ...ui.textSizes }; }, get textFloors() { return { ...LOOK.PHONE_TEXT, story: LOOK.STORY_TEXT_MIN }; }, get textOverflows() { return ui.textOverflows.map(q => ({ ...q })); }, get rotateShown() { return ui.rotateShown; }, get bannerRect() { return ui.bannerRect && { ...ui.bannerRect }; },
    get minimap() { return ui.mmShown ? { x: mmState.x, y: mmState.y, w: mmState.w, h: mmState.h, alpha: mmState.alpha, baseDraws: mmDraws, markers: mmState.markers.slice(0, mmCount).map(m => ({ ...m })) } : null; },
    get edgeArrows() { return ui.edgeArrows.map(a => ({ ...a })); }, get hudRects() { return ui.hudRects.map(r => ({ ...r })); },
    get sticks() { return [...sticks].map(([id, s]) => ({ id, ...s })); },
    // слой интерфейса: размер в UI px, размер холста в CSS px, scale = CSS px на UI px (SPEC-005)
    get uiSize() { return { w: UW, h: UH, cssW: CSS_W, cssH: CSS_H, scale: CSS_W / UW }; }, toGame,
    get names() { return allNames(); }, setName, nameOf, inDanger, get stars() { return bonusStars; }, spawnStar, giveReward,
    get dangerZone() { return dangerZone; }, get safeZone() { return safeZone; }, get texts() { return ui.texts; }, generateLevel,
    // сетка карты (до SPEC-006 называлась world)
    grid: { COLS, ROWS, CELL, get blocked() { return Array.from(blocked); }, get blockedBig() { return Array.from(blockedBig); }, seeSolid: seeSolidAt, get bushes() { return bushes.map(q => ({ ...q })); },
      get obstacles() { return obstacles.map(o => ({ kind: o.kind, shape: o.shape, x: o.x, y: o.y, w: o.w, h: o.h, r: o.r, move: o.move, sight: o.sight })); } },
    get kisses() { return kisses; }, throwKiss, buyKisses, resetProgress, heartFill, bigBoost, fmtHearts,
    RESCUE_KIT, buyRescueKit, useRescueKit, get kitHint() { return ui.kitHintRect; },   // SPEC-007
    // SPEC-019: бежит ли маленький i (true/false); значок над Большим; подсказка «услышал топот» (текст, чья, плашка этого кадра) или null;
    // джойстики этого кадра с кольцом «на цыпочках»
    isRunning: i => isRunning(littles[i]), get bigMark() { return bigMark(); },
    get heardHint() { return heardHintOn() ? { text: heardHintText(), pi: heardHintPi, rect: ui.heardHintRect && { ...ui.heardHintRect, rows: [...ui.heardHintRect.rows] } } : null; },
    get stickMarks() { return ui.stickMarks.map(q => ({ ...q })); }, get tapLines() { return [...tapLines]; },
    GLOVES, KISSES, get shopLayout() { return ui.shopLayout; },                         // SPEC-007 AC 10
    levelType, levelReport, get levelInfo() { return levelInfo; }, clearLevelCache, CFG: CFG_ALL, THEMES, look3D, setBigFace,   // SPEC-021: look3D() — как нарисована 3D-сцена
    get banner() { return ui.banner; }, bannerAlpha,
    // всё состояние мира, которое levelReport сохраняет и возвращает (для теста «не трогает идущую игру»)
    worldState() { return JSON.stringify({ obstacles, bushes, floors, decor, trees, flowers, safeZone, dangerZone, spawns, reachable: Array.from(reachable).join(""), grids: [blocked, blockedBig, moveGrid, seeGrid, moveGridBig].map(g => g.join("")) }); },
    // детали 3D-карты с метками: [{ piece, color }] (для тестов оформления) и цвет текстуры земли в точке
    mapPieces() { const r = []; if (mapGroup) mapGroup.traverse(q => { if (q.userData.piece && q.material && q.material.color) r.push({ piece: q.userData.piece, color: "#" + q.material.color.getHexString(), y: q.position.y }); }); return r; },
    groundColorAt(x, y) { const d = groundCanvas.getContext("2d").getImageData(Math.round(x * 2), Math.round(y * 2), 1, 1).data; return "#" + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, "0")).join(""); }
  };
  window.__bb.SIM_DRAWN = SIM_DRAWN;
  window.__bb = new Proxy(window.__bb, {
    get(t, k, r) {
      if (simMode && SIM_DRAWN.includes(k)) throw new Error(`sim mode: __bb.${String(k)} is drawn state and nothing is drawn — this test needs a rendered page (openGame without sim)`);
      return Reflect.get(t, k, r);
    }
  });
}

// >>> client: main
// SPEC-008 / SPEC-011 AC 8d: тесты включают строгую игровую случайность и задают зерно запуска (init-скрипт до игры)
setStrictRng(window.__bbStrictRng === true);
if (Number.isFinite(window.__bbSeed)) seedRandom(window.__bbSeed);
initArt();
initScreen();
// SPEC-011 AC 3b: сторона клиента в порту hooks (Phase C: src/client/main.js) — до загрузки сохранений и до первой игры
setHooks({
  sfx: name => SFX[name](), burst, pop: popText, shake: v => { ui.shake = v; }, fx: clientFx, banner: bannerTick, rebuild: rebuild3D, save: writeProgress,
  onWin: noteOpenedWorld, onPracticeWin: () => tutorialNext(), inputFor: deviceInput
});
initSaves();
initInput();
initThree();
initCamera();
initMaterials();
initSync();
initCharacters();
initPreviews();

// =====================================================================
//  ГЛАВНЫЙ ЦИКЛ
// =====================================================================
fit();
resetWorld(1);
artGate();                                  // SPEC-020: экран загрузки ждёт картинки (недолго); игра уже готова
// SPEC-022: самый первый запуск (и старое сохранение без seen: история новая для всех) — комикс «Как всё началось» (под экраном
// загрузки, пока он есть). Тесты его пропускают: их init-скрипт ставит window.__bbNoIntro (кроме теста первого запуска)
let introDue = !progress.seen.intro && window.__bbNoIntro !== true;   // открывается в frame(), когда экрана загрузки уже нет
// SPEC-029: после комикса — обучение (только настоящий первый запуск: firstTutorial); тесты пропускают его: window.__bbNoTutorial
const tutorialDue = firstTutorial(progress) && window.__bbNoTutorial !== true;
window.__bbReady = true;
let last = performance.now();
function frame(now) {
  // первая метка rAF бывает раньше performance.now() при запуске: dt < 0 раскачивал тряску камеры (shake − dt) — не меньше 0
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (simMode) { requestAnimationFrame(frame); return; }   // sim: ни логики, ни рисования — игру шагает simRun
  if (introDue && mode === "home" && !document.getElementById("loading")) { introDue = false; openScene("intro", tutorialDue ? () => openTutorial("map") : null); }   // SPEC-022: первый запуск (SPEC-029: потом обучение)
  ui.T += dt;
  pollPads();
  if (!inWardrobe() && endTryOn()) resetWorld(numPlayers);   // SPEC-009/017: ушли из вкладки «Гардероб» (друзья — её часть) — примерка кончилась
  const portrait = isTouch && window.innerHeight > window.innerWidth;
  mapTick(dt);
  if (mode === "play" && !portrait) update(dt);
  else { updateFx(dt); if (inMenus()) big.dir += dt * 0.8; }
  noGameRng("render", () => {              // рисование не тянет игровую случайность (SPEC-008: тесты — ошибка, игра — vrand)
    updateCamera(dt);                       // телефон: камера за героем (3D-слой, не логика)
    updateMinimapFade(dt);                  // телефон: мини-карта бледнеет, когда под ней герой или Большой (SPEC-010)
    render3D(ui.T);
    drawUI(ui.T);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Офлайн-кэш (sw.js): только по http(s). С диска (file://) и на странице claude.ai — ничего не делаем и молчим.
function registerServiceWorker() {
  try {
    if ((location.protocol === "http:" || location.protocol === "https:") && navigator.serviceWorker) {
      navigator.serviceWorker.register("sw.js").catch(() => { /* регистрацию запретили — игра работает и так */ });
    }
  } catch (e) { /* нет доступа к serviceWorker */ }
}
registerServiceWorker();
installDebug();
