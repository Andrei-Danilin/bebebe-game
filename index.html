<style>
  html, body { margin: 0; height: 100%; background: #faf4e2; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* iPhone: keep the game out from under the notch and the home indicator (viewport-fit=cover) */
  body { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #wrap { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); background: #5f9e4a; }
  #wrap canvas { position: absolute; left: 0; top: 0; display: block; }
  #gl { pointer-events: none; }
  body.phone #wrap { border-radius: 0; box-shadow: none; }   /* телефон: игра на весь экран */
  #game { touch-action: none; }
  /* поле ввода имени поверх подписи на холсте (шрифт ≥ 16px — iPhone не увеличивает страницу) */
  .name-input { position: absolute; box-sizing: border-box; margin: 0; padding: 0 6px; border: 2px solid #ff6fa8; border-radius: 10px; line-height: 1; background: #fff; color: #3d2b1f; font-weight: 900; font-family: system-ui, "Segoe UI", Arial, sans-serif; text-align: center; outline: none; -webkit-user-select: text; user-select: text; z-index: 5; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #faf4e2; color: #2f3f8f; font: 700 22px system-ui, sans-serif; text-align: center; padding: 20px; }
  /* SPEC-020: полоска загрузки картинок; пока ждём картинки, игра уже готова — экран загрузки не ловит касания */
  #loadbar { width: min(320px, 70%); height: 14px; border: 3px solid #2f3f8f; border-radius: 10px; overflow: hidden; }
  #loadbar i { display: block; height: 100%; width: 0; background: #ff6fa8; }
  #loading.art { pointer-events: none; }
</style>

<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="game"></canvas>
  <div id="loading"><div>BeBeBe Atrapar 3D…</div><div id="loadbar"><i></i></div></div>
</div>
<script>
  // Если 3D-движок не загрузился (нет интернета) — покажем подсказку
  setTimeout(function () {
    if (!window.__bbReady && location.protocol !== "file:") {
      var el = document.getElementById("loading");
      if (el) el.innerHTML = "The 3D engine (three.js) needs an internet connection to load.<br>El motor 3D necesita internet.<br>O motor 3D precisa de internet.<br>Для 3D-движка нужен интернет.";
    }
  }, 6000);
  // SPEC-011 AC 6: the game is ES modules, which a page opened from disk (file:) cannot load — say how to open it, in the saved
  // language or the browser's (not I18N: the modules do not load here)
  if (location.protocol === "file:") {
    const FILE_NOTICE = { en: "Open the game from the website or run npm run serve", es: "Abrí el juego desde la página o corré npm run serve",
      pt: "Abra o jogo pelo site ou rode npm run serve", ru: "Откройте игру с сайта или запустите npm run serve" };
    let l = null;
    try { l = localStorage.getItem("bebebe-lang"); } catch (e) { /* no storage: the browser's language */ }
    if (!FILE_NOTICE[l]) l = (navigator.languages || [navigator.language]).map(x => String(x).slice(0, 2).toLowerCase()).find(x => FILE_NOTICE[x]) || "en";
    const el = document.getElementById("loading");
    if (el) el.innerHTML = "<div id=\"file-notice\">" + FILE_NOTICE[l] + "</div>";
  }
</script>
