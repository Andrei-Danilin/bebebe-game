<title>BeBeBe Atrapar 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b3a2e; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* iPhone: keep the game out from under the notch and the home indicator (viewport-fit=cover) */
  body { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #wrap { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); background: #5f9e4a; }
  #wrap canvas { position: absolute; left: 0; top: 0; display: block; }
  #gl { pointer-events: none; }
  body.phone #wrap { border-radius: 0; box-shadow: none; }   /* телефон: игра на весь экран */
  #game { touch-action: none; }
  /* поле ввода имени поверх подписи на холсте (шрифт ≥ 16px — iPhone не увеличивает страницу) */
  .name-input { position: absolute; box-sizing: border-box; margin: 0; padding: 0 6px; border: 2px solid #ff6fa8; border-radius: 10px; line-height: 1; background: #fff; color: #3d2b1f; font-weight: 900; font-family: system-ui, "Segoe UI", Arial, sans-serif; text-align: center; outline: none; -webkit-user-select: text; user-select: text; z-index: 5; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font: 700 22px system-ui, sans-serif; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="game"></canvas>
  <div id="loading">BeBeBe Atrapar 3D…</div>
</div>
<script>
  // Если 3D-движок не загрузился (нет интернета) — покажем подсказку
  setTimeout(function () {
    if (!window.__bbReady) {
      var el = document.getElementById("loading");
      if (el) el.innerHTML = "The 3D engine (three.js) needs an internet connection to load.<br>El motor 3D necesita internet.<br>Для 3D-движка нужен интернет.";
    }
  }, 6000);
</script>

  tryV(hy + 1, bb - 1, botDoor);
  items.push({ t: "floor", x: bx + 1, y: by + 1, w: bw - 2, h: bh - 2, kind: "tile" });
  reserve(bx - 3, by - 2, bw + 3, bh + 4);

  // Природа
  if (rng() < 0.5 || lv % 3 === 0) {
    for (let k = 0; k < 80; k++) {
      const w = ri(3, 4), h = 2, x = ri(1, COLS - w - 1), y = ri(1, ROWS - h - 1);
      if (isFree(x, y, w, h, 2)) { items.push({ t: "pond", x, y, w, h }); reserve(x, y, w, h); break; }
    }
  }
  place(Math.min(15, 7 + lv), (x, y) => ({ t: "tree", x, y, v: rng() < 0.6 ? "pine" : "round", s: 0.9 + rng() * 0.25 }));
  place(ri(2, 4), (x, y) => ({ t: "rock", x, y, s: 0.9 + rng() * 0.3 }));
  place(ri(3, 5), (x, y) => ({ t: "bush", x, y }), 2, 2, 0);
}
// общие кусочки раскладок
// Клетки стен (сетка COLS×ROWS) → прямоугольники-стены kind: сначала горизонтальные отрезки ≥ 2, остальное — вертикальными;
// клетки стен занимаются в occ
function emitWalls(items, occ, wall, kind) {
  const used = new Uint8Array(COLS * ROWS);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!wall[y * COLS + x] || used[y * COLS + x]) continue;
    let e = x; while (e + 1 < COLS && wall[y * COLS + e + 1]) e++;
    if (e > x) { items.push({ t: "wall", x, y, w: e - x + 1, h: 1, kind }); for (let k = x; k <= e; k++) used[y * COLS + k] = 1; }
  }
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
    if (!wall[y * COLS + x] || used[y * COLS + x]) continue;
    let e = y; while (e + 1 < ROWS && wall[(e + 1) * COLS + x] && !used[(e + 1) * COLS + x]) e++;
    items.push({ t: "wall", x, y, w: 1, h: e - y + 1, kind }); for (let k = y; k <= e; k++) used[k * COLS + x] = 1;
  }
  for (let k = 0; k < COLS * ROWS; k++) if (wall[k]) occ[k] = 1;
}
const shuffle = (rng, a) => { for (let k = a.length - 1; k > 0; k--) { const r = Math.floor(rng() * (k + 1)); [a[k], a[r]] = [a[r], a[k]]; } return a; };
const genTree = rng => (x, y) => ({ t: "tree", x, y, v: rng() < 0.6 ? "pine" : "round", s: 0.9 + rng() * 0.25 });
const genRock = rng => (x, y) => ({ t: "rock", x, y, s: 0.9 + rng() * 0.3 });
const genBush = (x, y) => ({ t: "bush", x, y });
const bushCount = (lc, [a, b]) => Math.max(CFG.BUSH_MIN[lc.type], lc.ri(a, b) - lc.tier);

// Поляна: никаких зданий — кусты, деревья, камни и маленькие лужи
function meadowLayout(lc) {
  const { rng, ri, items, reserve, isFree, place } = lc, L = CFG.LAYOUT.meadow;
  for (let n = ri(L.ponds[0], L.ponds[1]); n > 0; n--) for (let k = 0; k < 80; k++) {
    const w = ri(L.pondW[0], L.pondW[1]), h = 2, x = ri(1, COLS - w - 1), y = ri(1, ROWS - h - 1);
    if (isFree(x, y, w, h, 2)) { items.push({ t: "pond", x, y, w, h }); reserve(x, y, w, h); break; }
  }
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
  place(bushCount(lc, L.bushes), genBush, 2, 2, 1);
}

// Лабиринт из живой изгороди на сетке модулей 3×3 клетки: коридор 2 клетки + стена 1 клетка.
// Модули, задевающие домики с площадками у дверей, — одна открытая «область дома». Сначала идеальный лабиринт
// (Краскал), потом «плетение»: пробиваем стены у тупиков, пока их не останется ≤ MAZE_DEAD_ENDS; плюс 1–2 площади 5×5.
function mazeLayout(lc) {
  const { rng, ri, items, occ, reserve, place } = lc, L = CFG.LAYOUT.maze, M = L.module;
  const MC = Math.floor(COLS / M), MR = Math.ceil(ROWS / M), N = MC * MR;   // 10 × 7; крайние модули доходят до края карты
  const x0 = i => i * M, x1 = i => i === MC - 1 ? COLS - 1 : i * M + M - 2;
  const y0 = j => j * M, y1 = j => j === MR - 1 ? ROWS - 1 : j * M + M - 2;
  const id = (i, j) => j * MC + i;
  // модуль (с его стенами справа и снизу) задевает домик или площадку у двери
  const home = new Uint8Array(N);
  for (let j = 0; j < MR; j++) for (let i = 0; i < MC; i++) {
    for (let y = y0(j); y <= Math.min(ROWS - 1, y0(j) + M - 1); y++) for (let x = x0(i); x <= Math.min(COLS - 1, x0(i) + M - 1); x++) if (occ[y * COLS + x]) home[id(i, j)] = 1;
  }
  const edges = [];
  for (let j = 0; j < MR; j++) for (let i = 0; i < MC; i++) {
    if (i < MC - 1) edges.push({ a: id(i, j), b: id(i + 1, j), i, j, h: true, open: false });
    if (j < MR - 1) edges.push({ a: id(i, j), b: id(i, j + 1), i, j, h: false, open: false });
  }
  const edgeOf = (a, b) => edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
  const par = Array.from({ length: N }, (_, k) => k);
  const find = a => { while (par[a] !== a) a = par[a] = par[par[a]]; return a; };
  const dg = new Uint8Array(N);   // сколько проходов у модуля
  const openE = e => { if (!e.open) { e.open = true; dg[e.a]++; dg[e.b]++; } };
  const join = e => { const a = find(e.a), b = find(e.b); if (a === b) return false; par[a] = b; openE(e); return true; };
  // области домов — открыты внутри
  for (const e of edges) if (home[e.a] && home[e.b]) { join(e); openE(e); }
  // площади: блок 2×2 модуля (5×5 клеток), не в широком крайнем столбце, не на доме и не рядом с другой площадью
  const plaza = new Uint8Array(N), plazas = [];
  const want = ri(L.plazas[0], L.plazas[1]);
  for (let k = 0; k < 60 && plazas.length < want; k++) {
    const i = ri(0, MC - 3), j = ri(0, MR - 2);
    let ok = true;
    for (let dj = -1; dj <= 2 && ok; dj++) for (let di = -1; di <= 2 && ok; di++) {
      const a = i + di, b = j + dj;
      if (a < 0 || b < 0 || a >= MC || b >= MR) continue;
      const inside = di >= 0 && di <= 1 && dj >= 0 && dj <= 1;
      if ((inside && home[id(a, b)]) || plaza[id(a, b)]) ok = false;
    }
    if (!ok) continue;
    for (const [di, dj] of [[0, 0], [1, 0], [0, 1], [1, 1]]) plaza[id(i + di, j + dj)] = 1;
    for (const [a, b] of [[id(i, j), id(i + 1, j)], [id(i, j + 1), id(i + 1, j + 1)], [id(i, j), id(i, j + 1)], [id(i + 1, j), id(i + 1, j + 1)]]) { const e = edgeOf(a, b); join(e); openE(e); }
    plazas.push({ i, j, x: x0(i), y: y0(j), w: x1(i + 1) - x0(i) + 1, h: y1(j + 1) - y0(j) + 1 });
  }
  // идеальный лабиринт
  const order = edges.filter(e => !e.open);
  for (let k = order.length - 1; k > 0; k--) { const r = Math.floor(rng() * (k + 1)); [order[k], order[r]] = [order[r], order[k]]; }
  for (const e of order) join(e);
  // тупики: обычный модуль с одним проходом
  const deg = m => dg[m];
  const deadList = () => { const r = []; for (let m = 0; m < N; m++) if (!home[m] && !plaza[m] && deg(m) === 1) r.push(m); return r; };
  let dead = deadList();
  const before = dead.length, target = Math.floor(before * CFG.MAZE_DEAD_ENDS);
  for (let k = dead.length - 1; k > 0; k--) { const r = Math.floor(rng() * (k + 1)); [dead[k], dead[r]] = [dead[r], dead[k]]; }
  for (const m of dead) {
    if (deadList().length <= target) break;
    if (deg(m) !== 1) continue;
    const closed = edges.filter(e => !e.open && (e.a === m || e.b === m));
    if (!closed.length) continue;
    const other = e => e.a === m ? e.b : e.a;
    const pick = closed.find(e => !home[other(e)] && !plaza[other(e)] && deg(other(e)) === 1) || closed[Math.floor(rng() * closed.length)];
    openE(pick);
  }
  lc.meta.deadEndsBefore = before;
  lc.meta.deadEndsAfter = deadList().length;
  // стены в клетки (кроме домиков и площадок у дверей)
  const wall = new Uint8Array(COLS * ROWS);
  const put = (x, y) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS && !occ[y * COLS + x]) wall[y * COLS + x] = 1; };
  for (const e of edges) {
    if (e.open) continue;
    if (e.h) for (let y = y0(e.j); y <= y1(e.j); y++) put(x1(e.i) + 1, y);
    else for (let x = x0(e.i); x <= x1(e.i); x++) put(x, y1(e.j) + 1);
  }
  for (let j = 0; j < MR - 1; j++) for (let i = 0; i < MC - 1; i++) {   // столбики на перекрёстках
    const near = [edgeOf(id(i, j), id(i + 1, j)), edgeOf(id(i, j + 1), id(i + 1, j + 1)), edgeOf(id(i, j), id(i, j + 1)), edgeOf(id(i + 1, j), id(i + 1, j + 1))];
    if (near.some(e => !e.open)) put(x1(i) + 1, y1(j) + 1);
  }
  emitWalls(items, occ, wall, "maze");
  // деревья — в центрах площадей, кусты — по одному на площадь, остальные — в широких местах коридоров
  const trees = Math.min(plazas.length, ri(L.trees[0], L.trees[1])), tree = genTree(rng);
  for (let k = 0; k < trees; k++) { const q = plazas[k], cx = q.x + 2, cy = q.y + 2; items.push(tree(cx, cy)); reserve(cx, cy, 1, 1); }
  let bushes = bushCount(lc, L.bushes);
  for (const q of plazas) {
    if (bushes <= 0) break;
    const c = [[q.x, q.y], [q.x + q.w - 2, q.y], [q.x, q.y + q.h - 2], [q.x + q.w - 2, q.y + q.h - 2]][ri(0, 3)];
    items.push(genBush(c[0], c[1])); reserve(c[0], c[1], 2, 2); bushes--;
  }
  place(bushes, genBush, 2, 2, 0);
  lc.meta.areas = { plazas: plazas.map(q => ({ x: q.x, y: q.y, w: q.w, h: q.h })) };
}

// Деревня: 5–8 домиков-блоков с улицами ≥ 2 клеток вокруг, площадь с фонтаном в середине
function villageLayout(lc) {
  const { rng, ri, items, reserve, isFree, place } = lc, L = CFG.LAYOUT.village, S = L.street;
  const sw = ri(L.squareW[0], L.squareW[1]), sh = ri(L.squareH[0], L.squareH[1]);
  const sx = Math.floor((COLS - sw) / 2) + ri(-1, 1), sy = Math.floor((ROWS - sh) / 2) + ri(-1, 1);
  items.push({ t: "floor", x: sx, y: sy, w: sw, h: sh, kind: "square" });
  const F = L.fountain;
  items.push({ t: "pond", x: sx + Math.floor((sw - F) / 2), y: sy + Math.floor((sh - F) / 2), w: F, h: F, fountain: true });
  reserve(sx, sy, sw, sh);
  const cottages = [], want = ri(L.cottages[0], L.cottages[1]);
  for (let k = 0; k < 800 && cottages.length < want; k++) {
    let w = ri(L.cottageA[0], L.cottageA[1]), h = ri(L.cottageB[0], L.cottageB[1]);
    if (rng() < 0.5) [w, h] = [h, w];
    const x = ri(S, COLS - w - S), y = ri(S, ROWS - h - S);
    if (isFree(x, y, w, h, S)) { const c = { t: "cottage", x, y, w, h }; items.push(c); cottages.push(c); reserve(x, y, w, h); }
  }
  if (cottages.length < L.cottages[0]) lc.meta.bad = "cottages";
  // кусты во дворах — вплотную к домикам
  let bushes = bushCount(lc, L.bushes);
  for (let k = 0; k < 400 && bushes > 0 && cottages.length; k++) {
    const c = cottages[ri(0, cottages.length - 1)], side = ri(0, 3);
    const x = side === 0 ? c.x - 2 : side === 1 ? c.x + c.w : ri(c.x - 1, c.x + c.w - 1);
    const y = side === 2 ? c.y - 2 : side === 3 ? c.y + c.h : ri(c.y - 1, c.y + c.h - 1);
    if (isFree(x, y, 2, 2, 0)) { items.push(genBush(x, y)); reserve(x, y, 2, 2); bushes--; }
  }
  place(bushes, genBush, 2, 2, 0);
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
}

// Река с мостиками: вода 2–3 клетки от края до края между домиками (горизонтально; при доме Большого по диагонали —
// иногда вертикально), каждые 4–6 клеток сдвигается на ±1; 2–3 мостика шириной 2–3 клетки; кусты на обоих берегах
function riverLayout(lc) {
  const { rng, ri, items, reserve, place } = lc, L = CFG.LAYOUT.river, A = CFG.DOOR_APRON;
  const diag = lc.homes.variant === "diagonal", vertical = diag && rng() < 0.5;
  const along = vertical ? ROWS : COLS, w = ri(L.width[0], L.width[1]);
  // полоса между домиками с их площадками у дверей
  const lo = vertical ? lc.homes.small.w + A : lc.homes.small.h + A;
  const hi = vertical ? lc.homes.big.x - A - 1 : lc.homes.big.y - A - 1;
  const maxOff = hi - w + 1, top = new Array(along);
  let off = ri(lo, maxOff);
  for (let pos = 0; pos < along;) {
    const seg = ri(L.bend[0], L.bend[1]);
    for (let k = 0; k < seg && pos < along; k++) top[pos++] = off;
    const d = rng() < 0.5 ? -1 : 1;
    off = off + d >= lo && off + d <= maxOff ? off + d : off - d;
  }
  // мостики: по одному в каждой части реки, на прямом куске; при домах на одной стороне — не у самих домов
  const nb = ri(L.bridges[0], L.bridges[1]), bridge = new Uint8Array(along), bridges = [];
  const minS = !vertical && !diag ? lc.homes.small.w + A + 1 : 1;
  for (let k = 0; k < nb; k++) {
    const bw = ri(L.bridgeW[0], L.bridgeW[1]), p0 = Math.floor(k * along / nb), p1 = Math.floor((k + 1) * along / nb) - 1;
    const cand = [];
    for (let st = Math.max(p0, minS); st + bw - 1 <= Math.min(p1, along - 2); st++) {
      let ok = true;
      for (let q = st; q < st + bw; q++) if (top[q] !== top[st] || bridge[q]) ok = false;
      if (ok && !bridge[st - 1] && !bridge[st + bw]) cand.push(st);
    }
    if (!cand.length) continue;
    const st = cand[ri(0, cand.length - 1)];
    for (let q = st; q < st + bw; q++) bridge[q] = 1;
    bridges.push(vertical ? { x: top[st], y: st, w, h: bw } : { x: st, y: top[st], w: bw, h: w });
  }
  if (bridges.length < L.bridges[0]) lc.meta.bad = "bridges";
  // вода — прямыми кусками без мостиков
  for (let p = 0; p < along;) {
    if (bridge[p]) { p++; continue; }
    let e = p; while (e + 1 < along && !bridge[e + 1] && top[e + 1] === top[p]) e++;
    const r = vertical ? { x: top[p], y: p, w, h: e - p + 1 } : { x: p, y: top[p], w: e - p + 1, h: w };
    items.push({ t: "water", ...r }); reserve(r.x, r.y, r.w, r.h);
    p = e + 1;
  }
  for (const b of bridges) { items.push({ t: "floor", kind: "bridge", ...b, across: vertical ? "x" : "y" }); reserve(b.x, b.y, b.w, b.h); }
  // берег клетки: 0 — сторона домика маленьких, 1 — другая
  const bank = (x, y) => vertical ? (x < top[y] ? 0 : 1) : (y < top[x] ? 0 : 1);
  const nBush = bushCount(lc, L.bushes), half = Math.ceil(nBush / 2);
  place(half, genBush, 2, 2, 0, (x, y) => bank(x, y) === 0);
  place(nBush - half, genBush, 2, 2, 0, (x, y) => bank(x, y) === 1);
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
  lc.meta.areas = { bridges: bridges.map(b => ({ ...b })) };
  lc.meta.vertical = vertical;
}

// Дом с комнатами (дом Большого по диагонали): здание из двух крыльев вокруг двор(ов) домиков — A справа сверху,
// B слева снизу, общая стена между ними. Каждое крыло делится пополам (BSP) на комнаты ≥ 4×4 внутри; в каждой
// стене деления дверь (2 клетки), примерно в трети — вторая; 3–4 двери наружу, в оба двора.
function roomsLayout(lc) {
  const { rng, ri, items, occ, reserve, isFree, place } = lc, L = CFG.LAYOUT.rooms, A = CFG.DOOR_APRON, MR = L.minRoom;
  if (lc.homes.variant !== "diagonal") { lc.meta.bad = "homes"; return; }   // крылья здания — только вокруг домов по диагонали
  const sh = lc.homes.small, bh = lc.homes.big;
  const ax0 = sh.x + sh.w + A, ay1 = bh.y - A - 1;            // крыло A: x ax0..COLS-1, y 0..ay1
  const bx1 = bh.x - A - 1, by0 = ay1;                         // крыло B: x 0..bx1, y by0..ROWS-1 (общая стена y = ay1)
  const wings = [{ x0: ax0, y0: 0, x1: COLS - 1, y1: ay1 }, { x0: 0, y0: by0, x1: bx1, y1: ROWS - 1 }];
  const wall = new Uint8Array(COLS * ROWS), door = new Uint8Array(COLS * ROWS), doors = [];
  const at = (x, y) => y * COLS + x;
  for (const g of wings) {
    for (let x = g.x0; x <= g.x1; x++) { wall[at(x, g.y0)] = 1; wall[at(x, g.y1)] = 1; }
    for (let y = g.y0; y <= g.y1; y++) { wall[at(g.x0, y)] = 1; wall[at(g.x1, y)] = 1; }
  }
  // дверь: 2 клетки в стене; vert — стена вертикальная (дверь сверху вниз)
  const addDoor = (x, y, vert, kind) => {
    const c = vert ? [[x, y], [x, y + 1]] : [[x, y], [x + 1, y]];
    for (const [cx, cy] of c) { wall[at(cx, cy)] = 0; door[at(cx, cy)] = 1; }
    doors.push({ x, y, w: vert ? 1 : 2, h: vert ? 2 : 1, vert, kind });
  };
  const free2 = (vert, x, y, list) => list.every(([cx, cy]) => !door[at(cx, cy)]) && !door[at(vert ? x : x - 1, vert ? y - 1 : y)] && !door[at(vert ? x : x + 2, vert ? y + 2 : y)];
  // двери наружу: стены крыльев, смотрящие во дворы (по 1–2 в каждый двор, всего 3–4)
  const segs = {
    small: [{ vert: true, x: ax0, a: 1, b: ay1 - 1 }, { vert: false, y: by0, a: 1, b: ax0 - 1 }],
    big: [{ vert: false, y: ay1, a: bx1 + 1, b: COLS - 2 }, { vert: true, x: bx1, a: by0 + 1, b: ROWS - 2 }]
  };
  const total = ri(L.outsideDoors[0], L.outsideDoors[1]), perYard = { small: 1, big: 1 };
  perYard[rng() < 0.5 ? "small" : "big"] += total - 2 > 0 ? 1 : 0;
  if (total - 2 > 1) perYard[perYard.small > 1 ? "big" : "small"]++;
  // первая дверь во двор маленьких — напротив правой стены их домика: иначе полоса между домиком и зданием —
  // тупик для Большого (в домик ему нельзя)
  addDoor(ax0, ri(1, sh.h - 2), true, "out:small"); perYard.small--;
  for (const yard of ["small", "big"]) {
    let left = perYard[yard];
    for (let k = 0; k < 80 && left > 0; k++) {
      const sg = segs[yard][ri(0, 1)], st = ri(sg.a, sg.b - 1);
      const x = sg.vert ? sg.x : st, y = sg.vert ? st : sg.y;
      const cells = sg.vert ? [[x, y], [x, y + 1]] : [[x, y], [x + 1, y]];
      if (!free2(sg.vert, x, y, cells)) continue;
      addDoor(x, y, sg.vert, "out:" + yard); left--;
    }
  }
  // общая стена между крыльями: 1 дверь (иногда 2)
  const sharedDoor = () => { for (let k = 0; k < 40; k++) { const x = ri(ax0 + 1, bx1 - 2); if (free2(false, x, ay1, [[x, ay1], [x + 1, ay1]])) { addDoor(x, ay1, false, "in"); return; } } };
  sharedDoor(); if (rng() < L.secondDoor) sharedDoor();
  // BSP: r — внутренность (без стен). Линия деления не упирается в дверь соседней стены.
  const rooms = [];
  const split = r => {

  const side = (x, y, d) => { const k = roomAt(x, y); return k >= 0 ? k : d.kind.startsWith("out:") ? d.kind.slice(4) : -1; };

    a: d.vert ? side(d.x - 1, d.y, d) : side(d.x, d.y - 1, d), b: d.vert ? side(d.x + 1, d.y, d) : side(d.x, d.y + 1, d) }));

// Арена: блок в середине, вокруг кольцо стен через 3 клетки с 3–4 проходами; у половины уровней ещё полукольцо

  const { rng, ri, items, occ, reserve, isFree, place } = lc, L = CFG.LAYOUT.arena, D = L.ring + 1, bh = L.blockH, HG = L.halfGap;
  if (lc.homes.variant !== "diagonal") { lc.meta.bad = "homes"; return; }   // полукольцу нужны свободные углы (слева внизу / справа вверху)
  let half = rng() < L.halfRing;

  // при полукольце кольцо сдвинуто от того края, где ему нужно место (2 клетки коридор + стена + 2 клетки)
  const by = corner === "bl" ? Math.floor((ROWS - bh) / 2) - 1 : corner === "tr" ? Math.floor((ROWS - bh) / 2) + 1 : Math.floor((ROWS - bh) / 2) + ri(-1, 1);

    for (let x = D + 2; x + bw + D + 2 <= COLS; x++) if (isFree(x - D, by - D, bw + 2 * D, bh + 2 * D, 0)) opts.push(x);
    if (opts.length) { bx = opts[ri(0, opts.length - 1)]; break; }
  }

  const x0 = bx - D, y0 = by - D, x1 = bx + bw + D - 1, y1 = by + bh + D - 1;
  const wall = new Uint8Array(COLS * ROWS), at = (x, y) => y * COLS + x;
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS) wall[at(x, y)] = v; };
  for (let x = x0; x <= x1; x++) { set(x, y0, 1); set(x, y1, 1); }
  for (let y = y0; y <= y1; y++) { set(x0, y, 1); set(x1, y, 1); }

  const gaps = [], n = ri(L.gaps[0], L.gaps[1]);
  for (const sd of shuffle(rng, ["top", "bottom", "left", "right"]).slice(0, n)) {
    const gw = ri(L.gapW[0], L.gapW[1]), horiz = sd === "top" || sd === "bottom";
    const st = horiz ? ri(x0 + 2, x1 - 1 - gw) : ri(y0 + 2, y1 - 1 - gw);
    const g = horiz ? { x: st, y: sd === "top" ? y0 : y1, w: gw, h: 1 } : { x: sd === "left" ? x0 : x1, y: st, w: 1, h: gw };

  // снаружи от него тоже HG свободных клеток до края карты, и оно не задевает домики — иначе его нет
  const halfGaps = [];
  if (half) {
    const hx = corner === "bl" ? x0 - HG - 1 : x1 + HG + 1, hy = corner === "bl" ? y1 + HG + 1 : y0 - HG - 1;
    const mx = Math.floor((x0 + x1) / 2), my = Math.floor((y0 + y1) / 2);
    const vy0 = Math.min(my, hy), vy1 = Math.max(my, hy), hx0 = Math.min(mx, hx), hx1 = Math.max(mx, hx);
    const arm = [];
    for (let y = vy0; y <= vy1; y++) arm.push([hx, y]);
    for (let x = hx0; x <= hx1; x++) arm.push([x, hy]);
    half = arm.every(([x, y]) => x >= HG && y >= HG && x < COLS - HG && y < ROWS - HG && !occ[at(x, y)]);
    if (half) {

      const gv = ri(L.gapW[0], L.gapW[1]), gvy = ri(vy0 + 1, vy1 - 1 - gv), gh = ri(L.gapW[0], L.gapW[1]), ghx = ri(hx0 + 1, hx1 - 1 - gh);
      for (let y = gvy; y < gvy + gv; y++) set(hx, y, 0);
      for (let x = ghx; x < ghx + gh; x++) set(x, hy, 0);
      halfGaps.push({ x: hx, y: gvy, w: 1, h: gv }, { x: ghx, y: hy, w: gh, h: 1 });

  place(bushCount(lc, L.bushes), genBush, 2, 2, 0, (x, y) => x > x0 && y > y0 && x + 1 < x1 && y + 1 < y1);
  reserve(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
  lc.meta.areas = { block: [{ x: bx, y: by, w: bw, h: bh }], ring: [{ x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 }], gaps, halfGaps };

const LAYOUTS = {

  river: riverLayout, rooms: roomsLayout, arena: arenaLayout

// Новое состояние мира здесь → добавить его в список keep у levelReport (и в __bb.worldState)

    if (it.t === "wall") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: true, kind: it.kind });
    else if (it.t === "cottage") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: true, kind: "cottage" });
    else if (it.t === "water") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: false, kind: "water" });
    else if (it.t === "pond") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: false, kind: "pond", fountain: !!it.fountain });

    else if (it.t === "rock") obstacles.push({ shape: "circle", x: px + 16, y: py + 16, r: 16, sr: 16, move: true, sight: true, kind: "rock", s: it.s });

function connectivity() {

  while (q.length) {

    if (storyPage === "chapters") {

// SPEC-019: на цыпочках с клавиатуры — Shift: один игрок — любой; двое — игрок 1 левый Shift, игрок 2 правый Ctrl
// (правый Shift остаётся спасалкой игрока 2)
const TIPTOE_KEYS = [["ShiftLeft", "ShiftRight"], ["ShiftLeft"], ["ControlRight"]];
const tiptoeKey = pi => (numPlayers === 1 ? TIPTOE_KEYS[0] : TIPTOE_KEYS[pi + 1] || []).some(k => keys.has(k));
// Длина вектора — доля скорости. Стик/геймпад: наклон t < TIPTOE_MAX — на цыпочках (до TIPTOE_MULT), больше — бегом (t);
// Shift — не быстрее TIPTOE_MULT. Автопилот — как есть (его длина и есть доля скорости).
function inputFor(l) {
  const pi = l.id;
  let x = 0, y = 0;
  const c = l.controls, pressed = arr => arr.some(k => keys.has(k));
  x += (pressed(c.right) ? 1 : 0) - (pressed(c.left) ? 1 : 0);
  y += (pressed(c.down) ? 1 : 0) - (pressed(c.up) ? 1 : 0);
  pads.forEach((p, i) => { if (numPlayers === 1 || i === pi) { x += p.x; y += p.y; } });
  for (const s of sticks.values()) {
    if (s.player !== pi) continue;
    const R = stickR(), dx = (s.x - s.ox) / R, dy = (s.y - s.oy) / R;
    if (Math.hypot(dx, dy) > 0.15) { x += dx; y += dy; }
  }
  const t = Math.min(1, Math.hypot(x, y));
  if (t > 0) {
    let f = t < CFG.TIPTOE_MAX ? CFG.TIPTOE_MULT * t / CFG.TIPTOE_MAX : t;
    if (tiptoeKey(pi)) f = Math.min(f, CFG.TIPTOE_MULT);
    const k = f / Math.hypot(x, y);
    x *= k; y *= k;
  }
  const ap = autoMove[pi];                     // SPEC-008: автопилот — как ещё один джойстик этого игрока
  if (ap) { x += ap.x; y += ap.y; }
  const d = Math.hypot(x, y);
  if (d > 1) { x /= d; y /= d; }
  return { x, y };
}

// +SPEED_PER_LEVEL; злость — каждое ЦЕЛОЕ потерянное сердечко +BIG_SPEED_PER_HIT. Ни одна скорость не больше BIG_CHASE_MAX (вместе со злостью).
const levelBoost = (world, n) => (CFG.WORLD_SPEED_START[worldDifficulty(world)] ?? CFG.WORLD_SPEED_START.at(-1)) + levelPos(n) * CFG.SPEED_PER_LEVEL;
const bigHearts = (world, n) => Math.min(CFG.BIG_HP_MAX, CFG.BIG_HP + Math.floor(levelPos(n) / CFG.HP_LEVELS_PER_HEART) + worldDifficulty(world) * CFG.HP_PER_WORLD);
const chaseCap = v => Math.min(CFG.BIG_CHASE_MAX, v);
// Единственный источник чисел Большого: { chase, search, patrol, hearts, boost } уровня (мир, n);
// lost — сколько сердечек уже отняли (злость), по умолчанию 0; boost — прибавка без потолка
function difficulty(world, n, lost = 0) {
  const boost = levelBoost(world, n) + Math.floor(lost) * CFG.BIG_SPEED_PER_HIT;
  return { chase: chaseCap(CFG.BIG_CHASE_SPEED + boost), search: chaseCap(CFG.BIG_CHASE_SPEED * 0.85 + boost),
    patrol: chaseCap(CFG.BIG_PATROL_SPEED + boost * 0.5), hearts: bigHearts(world, n), boost };
}
const bigDifficulty = () => difficulty(curWorld, level, big.maxHp - big.hp);
const bigBoost = () => bigDifficulty().boost;                     // насколько Большой быстрее сейчас (без потолка)
function bigSpeeds() { const d = bigDifficulty(); return { chase: d.chase, search: d.search, patrol: d.patrol }; }
function updateHugAnim(dt) {
  for (const l of littles) {

    l.hugAnim -= dt;
    const back = big.dir + Math.PI;
    l.x = big.x + Math.cos(back) * (big.r + l.r + 2);
    l.y = big.y + Math.sin(back) * (big.r + l.r + 2);
    l.dir = big.dir; l.moving = false;
    if (vrand() < dt * 6) burst(big.x, big.y - 20, "heart", "#ff4d8d", 1);
    if (l.hugAnim <= 0) {                  // спрыгивает назад
      l.hugAnim = 0;
      l.kx = Math.cos(back) * 230; l.ky = Math.sin(back) * 230;

// ---------- Предметы ----------
function spawnItem() {
  const r = rng();
  const kind = r < 0.3 ? "boots" : r < 0.55 ? "cloak" : r < 0.75 ? "shield" : "banana";
  for (let k = 0; k < 80; k++) {
    const cx = 1 + Math.floor(rng() * (COLS - 2)), cy = 1 + Math.floor(rng() * (ROWS - 2));
    if (blocked[cy * COLS + cx]) continue;
    const p = { x: (cx + 0.5) * CELL, y: (cy + 0.5) * CELL };
    if (inSafe(p) || dist(p, big) < 90 || littles.some(l => dist(l, p) < 50) || items.some(it => dist(it, p) < 64)) continue;
    items.push({ id: ++itemSeq, kind, x: p.x, y: p.y, t: 0, life: kind === "banana" ? CFG.ITEM_LIFE + 8 : CFG.ITEM_LIFE });
    return;
  }
}
// ---------- Бонусные звёздочки: только игроки, +CFG.STAR_COINS монеток ----------
function starSpotOk(cx, cy) {
  const i = cy * COLS + cx;
  if (blocked[i] || !reachable[i]) return false;
  const p = { x: (cx + 0.5) * CELL, y: (cy + 0.5) * CELL };
  if (inSafe(p) || inDanger(p)) return false;
  if (dangerZone) {                                      // и не в стенах/дверях дома Большого, и не прямо перед ними
    const m = CFG.STAR_HOUSE_MARGIN * CELL, z = dangerZone;
    if (p.x > z.x - m && p.x < z.x + z.w + m && p.y > z.y - m && p.y < z.y + z.h + m) return false;
  }
  if (safeZone) {                                        // далеко от домика (от стен, значит и от любой двери)
    const dx = Math.max(safeZone.x - p.x, 0, p.x - safeZone.x - safeZone.w), dy = Math.max(safeZone.y - p.y, 0, p.y - safeZone.y - safeZone.h);
    if (Math.hypot(dx, dy) < CFG.STAR_MIN_FROM_HOME * CELL) return false;
  }

}
function spawnStar(x, y) {

  if (typeof x === "number" && typeof y === "number") p = { x, y };   // для тестов: в заданной точке

    const spots = [];
    for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) if (starSpotOk(cx, cy)) spots.push([cx, cy]);
    if (!spots.length) return null;
    const [cx, cy] = spots[Math.floor(rng() * spots.length)];
    p = { x: (cx + 0.5) * CELL, y: (cy + 0.5) * CELL };

function updateStars(dt) {

  for (const s of bonusStars) {
    s.t += dt;
    const l = littles.find(q => q.kind === "player" && canAct(q) && dist(q, s) < q.r + CFG.STAR_PICK);
    if (!l) continue;
    s.t = s.life;
    stats.starCoins += CFG.STAR_COINS;
    logEvent("star", { who: l.id });
    addCoins("star", CFG.STAR_COINS);   // сразу в копилку: остаются, даже если уровень не выигран
    popText(s.x, s.y - 30, "+" + CFG.STAR_COINS, "#fde047");

function updateItems(dt) {

  for (const l of littles) for (const k of ["boots", "cloak", "shield"]) l.fx[k] = Math.max(0, l.fx[k] - dt);
  for (const it of items) {

    if (it.kind === "banana") {
      if (big.slip <= 0 && big.stun <= 0 && dist(big, it) < big.r + 8) {

    if (l) {

      const base = it.kind === "boots" ? CFG.BOOTS_TIME : it.kind === "cloak" ? CFG.CLOAK_TIME : CFG.SHIELD_TIME;
      l.fx[it.kind] = base * (1 + playerBonus(l, "longItems"));   // SPEC-009: игроку дольше («долгие вещи»)
      popText(l.x, l.y - 40, L().items[it.kind], "#c4b5fd");

function updatePlayers(dt) {
  for (const l of littles) {
    if (l.kind !== "player") continue;
    l.moving = false; l.speedFrac = 0;
    if (!canAct(l)) continue;
    const v = inputFor(l), m = Math.hypot(v.x, v.y);
    if (m > 0.05) {
      const sp = moveSpeed(l);
      moveEntity(l, v.x * sp, v.y * sp, dt);
      l.dir = Math.atan2(v.y, v.x);
      l.walk += dt * 12 * m;
      l.moving = true;
      l.speedFrac = m;                      // SPEC-019: доля своей скорости (≤ TIPTOE_MULT — на цыпочках, тихо)
    }
  }
}

function fleePoint(b) {
  if (safeZone) {                        // домик рядом — бежим в домик
    const home = { x: safeZone.x + safeZone.w / 2, y: safeZone.y + safeZone.h / 2 };
    if (dist(b, home) < 260) return home;
  }
  const away = Math.atan2(b.y - big.y, b.x - big.x);
  for (const k of [0, 0.6, -0.6, 1.2, -1.2, 1.8, -1.8]) {
    const a = away + k;
    const x = clamp(b.x + Math.cos(a) * 140, 20, W - 20), y = clamp(b.y + Math.sin(a) * 140, 20, H - 20);
    if (!moveSolidAt(x, y) && reachable[cellIdx(x, y)] && !inCone(x, y) && !inDangerXY(x, y)) return { x, y };   // не за водой и не в «кармане»
  }
  return freePointNear({ x: clamp(b.x + Math.cos(away) * 140, 20, W - 20), y: clamp(b.y + Math.sin(away) * 140, 20, H - 20) });
}

// Боты: 1) спасают упавших (сначала игроков), 2) убегают, если их видят,
//       3) по очереди подкрадываются сзади, остальные ждут неподалёку
function updateBots(dt) {
  const bots = littles.filter(l => l.kind === "bot" && canAct(l));
  const downed = littles.filter(l => l.state === "down" && l.botWait <= 0)   // боты ждут BOT_RESCUE_DELAY после падения
    .sort((a, b) => ((a.kind === "player" ? 0 : 1) - (b.kind === "player" ? 0 : 1)) || (a.downTimer - b.downTimer));
  const free = new Set(bots), rescueTarget = new Map();
  for (const d of downed) {
    let best = null, bd = Infinity;
    for (const b of free) { const dd = dist(b, d); if (dd < bd) { bd = dd; best = b; } }
    if (best) { free.delete(best); rescueTarget.set(best, d); }
  }
  if (attackToken && (attackToken.state !== "ok" || !free.has(attackToken))) attackToken = null;

  for (const l of littles) if (l.kind === "bot") { l.moving = false; l.speedFrac = 0; }
  botAttackCd -= dt;
  for (const b of bots) {
    b.fleeT = Math.max(0, b.fleeT - dt);
    b.lurkT = Math.max(0, b.lurkT - dt);
    b.fleeRe -= dt;
    const seen = big.stun <= 0 && big.slip <= 0 && big.noPush <= 0 && big.blush <= 0 && canSee(b);
    const speed = CFG.BOT_SPEED * (b.fx.boots > 0 ? CFG.BOOTS_MULT : 1);
    let moved = false;

    if (b.dangerT > CFG.BOT_DANGER_LEAVE && dangerZone) {   // засиделся в доме Большого — к ближайшей двери
      b.task = "leave";
      const ex = nearestExit(b);
      moved = steerTo(b, ex.x, ex.y, speed, dt, false);
    } else if (big.slip > 0 && !rescueTarget.has(b) && dist(b, big) < 320) {   // Большой упал — бежим обнимать!
      b.task = "attack";
      moved = steerTo(b, big.x, big.y, speed, dt, false);
    } else if (rescueTarget.has(b) && !(seen && dist(b, big) < 90)) {
      const d = rescueTarget.get(b);
      b.task = "rescue";
      if (dist(b, d) > b.r + d.r + 4) moved = steerTo(b, d.x, d.y, speed, dt, false);
    } else {
      if (seen && b.fleeT <= 0) { b.fleeT = 1.0; b.fleeGoal = null; }
      if (seen) b.fleeT = Math.max(b.fleeT, 0.6);
      if (b.fleeT > 0) {
        b.task = "flee";
        if (attackToken === b) { attackToken = null; b.lurkT = rand(3, 6); }
        if (!b.fleeGoal || b.fleeRe <= 0 || dist(b, b.fleeGoal) < 15) { b.fleeGoal = fleePoint(b); b.fleeRe = 0.5; }
        moved = steerTo(b, b.fleeGoal.x, b.fleeGoal.y, speed, dt, false);
      } else {
        if (!attackToken && botAttackCd <= 0 && b.lurkT <= 0 && free.has(b)) { attackToken = b; b.tokenT = 8; }
        const back = big.dir + Math.PI;
        if (attackToken === b) {
          b.task = "attack";
          b.tokenT -= dt;
          if (b.tokenT <= 0) { attackToken = null; b.lurkT = rand(3, 6); }
          const a = back + b.offset;
          const rr = dist(b, big) > 95 ? 75 : big.r + b.r - 3;
          moved = steerTo(b, big.x + Math.cos(a) * rr, big.y + Math.sin(a) * rr, speed, dt, true);
        } else {
          b.task = "lurk";
          const g = lurkPoint(back + b.offset * 2.2);

    b.speedFrac = moved ? (b.task === "lurk" ? 0.8 : 1) : 0;   // SPEC-019: боты пока всегда бегут (lurk — 0.8 скорости)

  if (prevToken && attackToken !== prevToken) botAttackCd = rand(CFG.BOT_ATTACK_PAUSE[0], CFG.BOT_ATTACK_PAUSE[1]);
  prevToken = attackToken;

// Где ждать боту: в 170 px за Большим, но не в его доме; точка в стене или за водой — ближайшая свободная клетка
function lurkPoint(a0) {
  for (const k of [0, 0.5, -0.5, 1, -1, 1.5, -1.5, 2, -2, 2.5, -2.5, Math.PI]) {
    const a = a0 + k, p = { x: clamp(big.x + Math.cos(a) * 170, 24, W - 24), y: clamp(big.y + Math.sin(a) * 170, 24, H - 24) };
    if (!inDanger(p)) return freePointNear(p);
  }

}
function freePointNear(p) {
  const i = cellIdx(p.x, p.y);
  if (!blocked[i] && reachable[i] && !moveSolidAt(p.x, p.y)) return p;
  const c = freeCellNear(i);
  return { x: (c % COLS + 0.5) * CELL, y: (((c / COLS) | 0) + 0.5) * CELL };
}
// Ближайшая точка за дверью дома Большого
function nearestExit(p) {

  for (const e of (dangerZone ? dangerZone.exits : [])) { const d = dist(p, e); if (d < bd) { bd = d; best = e; } }
  if (best) return best;
  const c = freeCellNear(cellIdx(p.x, p.y));             // дверей не знаем — ближайшая свободная клетка снаружи
  return { x: (c % COLS + 0.5) * CELL, y: (((c / COLS) | 0) + 0.5) * CELL };

// =====================================================================
//  АВТОПИЛОТ (SPEC-008): ведёт маленьких игроков для проверки баланса. Видит то же, что игрок, а действует только как
//  игрок: «джойстик» autoMove, который читает inputFor(l), и кнопки 💋 throwKiss / 🩹 useRescueKit. Состояние Большого,
//  ботов, самих маленьких, CFG и progress не трогает (тест «the autopilot plays only through the players' inputs»);
//  своя память — autoNavs (путь к цели), путь ищет тем же steerPoint, что и боты.
//  careful — к спине в обход взгляда (за стенами и кустами), вблизи перед ним обходит сбоку, обнимает сзади и сразу
//            заходит за спину снова; спасает друзей; берёт звёздочки и предметы рядом, когда он туда не смотрит.
//  reckless — бежит прямо обниматься, ни от кого не прячется и никого не спасает.
// =====================================================================
let autoOn = false, autoStyle = "careful", autoNavs = new Map(), autoMove = [];
function autopilot(on, style) {
  if (typeof on === "boolean") autoOn = on;
  if (style === "careful" || style === "reckless") autoStyle = style;
  if (!autoOn) autoMove = [];
  return { on: autoOn, style: autoStyle };
}
const autoNav = l => {
  if (!autoNavs.has(l.id)) autoNavs.set(l.id, { x: l.x, y: l.y, r: l.r, path: [], repath: 0 });
  return autoNavs.get(l.id);
};
// Большой сейчас может толкнуть (не в шоке, не лежит, не краснеет, не отдыхает после толчка)
const bigDangerous = () => big.stun <= 0 && big.slip <= 0 && big.blush <= 0 && big.pushCd <= 0 && big.noPush <= 0;
// Точка у спины Большого: издалека — в backDist px за ним, вблизи — вплотную (обнимашка)
const backPoint = (l, d) => {
  const A = CFG.AUTOPILOT, a = big.dir + Math.PI, rr = d > A.backNear ? A.backDist : big.r + l.r - A.hugIn;
  return { x: big.x + Math.cos(a) * rr, y: big.y + Math.sin(a) * rr };
};
// Цель careful-игрока: { x, y, avoid (обходить взгляд), stop (px — ближе не подходить) }
function autoGoalCareful(l) {
  const A = CFG.AUTOPILOT, danger = bigDangerous();
  if (big.slip > 0) return { x: big.x, y: big.y, avoid: false, stop: 0 };   // лежит после банана — обнимать с любой стороны!
  let down = null;                                       // упавший друг, которого ни один бот не поднимет быстрее
  for (const d of littles) {
    if (d.state !== "down" || d === l || (danger && dist(d, big) <= A.rescueSafe)) continue;
    if (littles.some(o => o.kind === "bot" && o.state === "ok" && dist(o, d) < dist(l, d))) continue;
    if (!down || dist(l, d) < dist(l, down)) down = d;
  }
  if (down) return { x: down.x, y: down.y, avoid: true, stop: l.r + down.r + A.arrive };
  let pick = null;                                       // звёздочка или предмет рядом, пока он туда не смотрит
  for (const s of [...bonusStars, ...items.filter(it => it.kind !== "banana")]) {
    if (dist(l, s) < A.itemReach && (!danger || (dist(s, big) > A.pickSafe && !inCone(s.x, s.y))) && (!pick || dist(l, s) < dist(l, pick))) pick = s;
  }
  if (pick) return { x: pick.x, y: pick.y, avoid: true, stop: 0 };
  // обнимашка: близко и перед ним, а он может толкнуть, — обходим сбоку к спине; иначе к спине, издалека — в обход взгляда
  const d = dist(l, big), a = Math.atan2(l.y - big.y, l.x - big.x), side = normAng(a - big.dir);
  if (danger && d < A.orbit && Math.abs(side) < CFG.BEHIND_ANGLE) {

    return { x: big.x + Math.cos(t) * r, y: big.y + Math.sin(t) * r, avoid: false, stop: 0 };
  }

}
// Цель reckless-игрока: прямо к спине Большого (или к нему, если лежит), не прячась и никого не спасая
const autoGoalReckless = l => big.slip > 0 ? { x: big.x, y: big.y, avoid: false, stop: 0 } : { ...backPoint(l, dist(l, big)), avoid: false, stop: 0 };
// Решение автопилота на этот шаг: autoMove[pi] = { x, y } (как стик, длина ≤ 1) и нажатия 💋 / 🩹
function autoThink(dt) {
  autoMove = [];
  if (!autoOn || mode !== "play") return;
  const A = CFG.AUTOPILOT;
  for (const l of littles) {
    if (l.kind !== "player") continue;
    const n = autoNav(l);
    n.x = l.x; n.y = l.y;
    // 🩹: лежит долго и никто не поднимает (или уже хромает в домик, отдыхает)
    if (autoStyle === "careful" && canUseKit(l) && (l.state !== "down" || (l.rescue <= 0 && l.downTimer < CFG.DOWN_TIME - A.kitWait))) { useRescueKit(l.id); continue; }
    if (!canAct(l)) continue;
    const goal = autoStyle === "reckless" ? autoGoalReckless(l) : autoGoalCareful(l);
    if (Math.hypot(goal.x - l.x, goal.y - l.y) <= goal.stop) continue;
    const { tx, ty } = steerPoint(n, goal.x, goal.y, dt, goal.avoid, () => A.repath);
    const dx = tx - l.x, dy = ty - l.y, d = Math.hypot(dx, dy);
    if (d < A.minStep) continue;
    const sp = moveSpeed(l), m = Math.min(1, d / (sp * dt));   // не проскочить точку
    autoMove[l.id] = { x: dx / d * m, y: dy / d * m };
    // 💋: смотрит на Большого, он близко, видно, и поцелуй сработает
    if (autoStyle === "careful" && progress.inv.kisses > 0 && l.kissCd <= 0 && !inSafe(l) && big.stun <= 0 && big.blush <= 0 && big.hugCd <= 0 &&
      dist(l, big) < CFG.KISS_RANGE * A.kissReach && angDiff(l.dir, Math.atan2(big.y - l.y, big.x - l.x)) < A.kissAim &&
      los(l.x, l.y, big.x, big.y, seeSolidAt)) throwKiss(l.id);
  }
}

// ---------- SPEC-019: Большой слышит топот ----------
// Бежит (не на цыпочках): на ногах, идёт, доля скорости ≥ TIPTOE_MAX (на цыпочках — не больше TIPTOE_MULT)
const isRunning = l => !!l && l.state === "ok" && l.moving && l.speedFrac >= CFG.TIPTOE_MAX;
// Не слышит: в шоке (и при последней обнимашке), красный, лежит после банана, стоит после толчка, не идёт игра
const bigDeaf = () => mode !== "play" || pendingWin > 0 || big.stun > 0 || big.blush > 0 || big.slip > 0 || big.pushCd > 0;
const stopHearing = () => { big.noise = 0; big.hearTurnT = 0; big.hearLook = 0; };
// Шум за кадр: каждый бегущий рядом (HEAR_RADIUS клеток) вне взгляда (по углу), не невидимка и не в домике, — NOISE_RATE

    const c = CFG.NOISE_RATE * dt * (los(big.x, big.y, l.x, l.y, seeSolidAt) ? 1 : CFG.HEAR_WALL);

    if (c > best || (c === best && d < bestD)) { best = c; bestD = d; loud = l; }

// значок над Большим (тот же порядок, что рисуется): 🍌💫, ?!, 💗, ❓ (обернулся на топот), 👂 (слышит), 💦, !
function bigMark() {
  if (big.slip > 0) return "🍌💫";
  if (big.stun > 0) return "?!";
  if (big.blush > 0) return "💗";
  if (big.state === "look" && (big.hearTurnT > 0 || big.hearLook > 0)) return "❓";
  if (big.noise >= CFG.NOISE_WARN) return "👂";
  if (big.noPush > 0) return "💦";

function updateBig(dt) {
  big.flash = Math.max(0, big.flash - dt);
  big.hugCd = Math.max(0, big.hugCd - dt);
  big.moving = false;
  big.noPush = Math.max(0, big.noPush - dt);
  big.hearCd = Math.max(0, big.hearCd - dt);
  if (bigDeaf()) stopHearing();
  if (big.blush > 0) {                                   // покраснел: время идёт и пока лежит после банана
    big.blush = Math.max(0, big.blush - dt);
    if (big.blush <= 0 && big.slip <= 0 && big.stun <= 0) {   // прошло — поворачивается к тому, кто бросил, и в погоню
      const th = littles[big.blushBy] || littles[0];
      big.state = "chase"; big.lastSeen = { x: th.x, y: th.y };
      big.dir = Math.atan2(th.y - big.y, th.x - big.x); big.path = [];
      return;

  }
  if (big.slip > 0) { big.slip -= dt; big.moving = false; if (big.slip <= 0) { big.state = "look"; big.timer = 0.8; } return; }
  if (big.stun > 0) { big.stun -= dt; big.dir = turnToward(big.dir, big.stunFace, big.stunTurn * dt); return; }
  if (big.blush > 0) return;                             // стоит красный и никого не толкает
  if (big.pushCd > 0) {
    big.pushCd -= dt;
    if (big.pushCd <= 0) { big.state = "look"; big.timer = Math.max(0.5, big.noPush); big.lookSign = rng() < 0.5 ? -1 : 1; }
    return;
  }

  const speed = bigSpeeds();
  let target = null, td = Infinity;
  for (const l of littles) {
    if (big.noPush > 0) break;               // отдыхает — никого не ловит
    if (l.state !== "ok" || l.invuln > 0 || l.dizzy > 0) continue;   // с кружащейся головой не трогает
    if (canSee(l)) { const d = dist(big, l); if (d < td) { td = d; target = l; } }
  }
  if (target) {
    big.hearTurnT = 0; big.hearLook = 0;                 // видит — топот уже не важен; шум тает
    big.noise = Math.max(0, big.noise - CFG.NOISE_DECAY * dt);
    if (big.state !== "chase") { popText(big.x, big.y - 75, "!", "#ff3b30"); SFX.alert(); }
    big.state = "chase";

    big.moving = steerTo(big, target.x, target.y, speed.chase, dt, false);
    big.dir = turnToward(big.dir, Math.atan2(target.y - big.y, target.x - big.x), 7 * dt);

    return;
  }
  hearNoise(dt);
  if (big.state === "chase" || big.state === "search") {
    big.state = "search";
    big.moving = steerTo(big, big.lastSeen.x, big.lastSeen.y, speed.search, dt, false);
    if (big.moving) big.dir = turnToward(big.dir, big.moveDir, 6 * dt);
    if (!big.moving || dist(big, big.lastSeen) < 10) { big.state = "look"; big.timer = rand(1.5, 2.5); big.lookSign = rng() < 0.5 ? -1 : 1; }
    return;
  }
  if (big.state === "look") {
    if (big.hearTurnT > 0) { big.hearTurnT -= dt; big.dir = turnToward(big.dir, big.hearFace, big.hearRate * dt); }   // на топот
    else if (big.hearLook > 0) big.hearLook = Math.max(0, big.hearLook - dt);   // смотрит туда, не крутится
    else big.dir += big.lookSign * 1.7 * dt;

}

function separate() {
  const all = littles.filter(l => (l.state === "ok" || l.state === "down") && l.hugAnim <= 0);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.r + b.r;
    if (d >= min) continue;
    const am = a.state === "ok" ? 1 : 0, bm = b.state === "ok" ? 1 : 0, s = am + bm;
    if (!s) continue;
    const o = min - d;
    a.x -= dx / d * o * am / s; a.y -= dy / d * o * am / s;
    b.x += dx / d * o * bm / s; b.y += dy / d * o * bm / s;
    resolveWalls(a); resolveWalls(b);
  }
  for (const l of all) {
    const dx = l.x - big.x, dy = l.y - big.y, d = Math.hypot(dx, dy) || 0.01, min = l.r + big.r;
    if (d >= min) continue;
    if (l.state === "ok") { l.x += dx / d * (min - d); l.y += dy / d * (min - d); resolveWalls(l); }
    else { big.x -= dx / d * (min - d); big.y -= dy / d * (min - d); resolveWalls(big); }
  }
}
function checkContacts() {
  for (const l of littles) {
    if (mode !== "play") return;
    if (!canAct(l)) continue;   // голова кружится: не обнимает, толкнуть нельзя
    const dx = l.x - big.x, dy = l.y - big.y, d = Math.hypot(dx, dy);
    if (d > big.r + l.r + 4) continue;
    const a = Math.atan2(dy, dx), diff = angDiff(big.dir, a);
    if (diff > CFG.BEHIND_ANGLE || big.slip > 0) {                   // сзади — или Большой лежит после банана
      const wants = l.kind === "player" || l.task === "attack";   // боты обнимают только когда сами решили
      if (wants && big.hugCd <= 0 && l.hugCd <= 0 && big.stun <= 0) hug(l, a);
    }
    else if (diff < 1.9 && big.stun <= 0 && big.slip <= 0 && big.blush <= 0 && big.pushCd <= 0 && big.noPush <= 0 && l.invuln <= 0 && l.fx.cloak <= 0 && !inSafe(l)) push(l);

}

function updateDowned(dt) {

    l.botWait = Math.max(0, l.botWait - dt);
    // SPEC-009: рядом игрок — он и поднимает (с «быстрой помощью» быстрее); бот — всегда за RESCUE_TIME
    const helper = littles.find(o => o.kind === "player" && helps(o, l)) || littles.find(o => helps(o, l));
    l.rescueNeed = CFG.RESCUE_TIME * (1 - (helper ? playerBonus(helper, "quickHelp") : 0));
    l.rescue = helper ? l.rescue + dt : Math.max(0, l.rescue - CFG.RESCUE_DRAIN * dt);   // отошёл — прогресс тает

function updateDanger(dt) {

    if (l.hugAnim > 0) continue;                            // на плечах у Большого — время стоит

  l.dangerT = 0; l.dizzy = CFG.DIZZY_TIME; l.moving = false;

// Ближайшая свободная клетка (не стена и не дом Большого), поиск в ширину
function freeCellNear(idx) {
  const seen = new Uint8Array(COLS * ROWS), q = [idx];
  seen[idx] = 1;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], cx = i % COLS, cy = (i / COLS) | 0;
    if (!blocked[i] && reachable[i] && !inDangerXY((cx + 0.5) * CELL, (cy + 0.5) * CELL)) return i;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const j = ny * COLS + nx;
      if (!seen[j]) { seen[j] = 1; q.push(j); }
    }
  }

}

      if (l.moving) l.dir = turnToward(l.dir, l.moveDir, 8 * dt);
      if (!l.moving || dist(l, l.restSpot) < 6) { l.state = "rest"; l.restTimer = CFG.REST_TIME; l.moving = false; l.dir = Math.PI / 2; }

        logEvent("back", { who: l.id });

function update(dt) {
  stats.time += dt;
  if (banner && (banner.t += dt) >= CFG.BANNER_TIME) banner = null;
  for (const l of littles) {
    l.invuln = Math.max(0, l.invuln - dt);
    l.hugCd = Math.max(0, l.hugCd - dt);
    l.dizzy = Math.max(0, l.dizzy - dt);
    l.kissCd = Math.max(0, l.kissCd - dt);
    if (l.hugAnim <= 0 && Math.abs(l.kx) + Math.abs(l.ky) > 5) {
      moveEntity(l, l.kx, l.ky, dt);
      const f = Math.exp(-7 * dt); l.kx *= f; l.ky *= f;
    } else { l.kx = 0; l.ky = 0; }
  }

  heardHintT = Math.max(0, heardHintT - dt);

  updateHugAnim(dt);
  updateKisses(dt);

  checkContacts();
  updateDowned(dt);
  updateDanger(dt);
  updateResting(dt);
  updateItems(dt);
  updateStars(dt);
  updateFx(dt);
  if (pendingWin > 0) { pendingWin -= dt; if (pendingWin <= 0 && mode === "play") { mode = "win"; logEvent("win", {}); giveReward(true); SFX.win(); burst(big.x, big.y - 30, "heart", "#ff4d8d", 40); } }
  const players = littles.filter(p => p.kind === "player");

}
// SPEC-008: шагает игру пачкой (dt — сек игры за шаг), пока уровень идёт и не вышло seconds; → простые данные
function simRun(seconds, dt = CFG.BALANCE.SIM_DT) {
  const n = Math.round(seconds / dt);
  for (let i = 0; i < n && mode === "play"; i++) update(dt);

// sim(on): включить/выключить режим симуляции; без аргумента — только узнать. Выключили — 3D строится заново.
function sim(on) {

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);

}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }

function plainText(text, x, y, size, color = OUT, align = "left") {
  ctx.font = hudFont(size); ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  if (PHONE) noteText("drawn", size);
}
function label(text, x, y, size, color, align = "center") {
  ctx.font = `900 ${size}px system-ui, "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif`;   // = hudFont(size)
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = labelStroke(size); ctx.strokeStyle = OUT;
  ctx.strokeText(text, x, y);

  if (PHONE) noteText("drawn", size);
}
function fitText(text, x, y, size, maxW, align, color, weight, min = 9) {
  let sz = size + 0.5;
  do { sz = Math.max(min, sz - 0.5); ctx.font = `${weight} ${sz}px system-ui, "Segoe UI", sans-serif`; } while (ctx.measureText(text).width > maxW && sz > min);
  ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  if (PHONE) noteText("drawn", sz);

}
// Текст в несколько строк (по словам), не больше lines строк; не влезает — мельче
function wrapText(text, x, y, size, maxW, lines, color, weight) {
  let sz = size, rows = [];
  for (;;) {
    ctx.font = `${weight} ${sz}px system-ui, "Segoe UI", sans-serif`;
    rows = [];
    let cur = "";
    for (const wd of text.split(" ")) {
      const t = cur ? cur + " " + wd : wd;
      if (ctx.measureText(t).width > maxW && cur) { rows.push(cur); cur = wd; } else cur = t;
    }
    rows.push(cur);
    if ((rows.length <= lines && rows.every(r => ctx.measureText(r).width <= maxW)) || sz <= 9) break;
    sz -= 0.5;

  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = color;

// Подпись с контуром, которая сжимается под ширину (не мельче 11px), а если не влезает — обрезается «…»
function labelFit(text, x, y, size, maxW, color, align = "center", min = 11) {
  const font = sz => `900 ${sz}px system-ui, "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif`;
  let sz = size;
  ctx.font = font(sz);
  while (ctx.measureText(text).width > maxW && sz > min) { sz = Math.max(min, sz - 0.5); ctx.font = font(sz); }
  let chars = Array.from(text);
  while (chars.length > 1 && ctx.measureText(text).width > maxW) { chars = chars.slice(0, -1); text = chars.join("").trimEnd() + "…"; }
  label(text, x, y, sz, color, align);

function minimapBase(r) {

// SPEC-010: герой или Большой (точка ног на экране) под мини-картой с запасом MINIMAP_UNDER_PAD → вся карта бледнеет
let mmAlpha = 1;
function minimapUnder() {

function homePill(id, text, h, size, min, pic, extra = {}) {

// рисует плашку (текст сжимается не мельче min, потом «…»); в hudRects — { id, text, textW, …extra }
function drawPill(p, x, y, maxW) {
  const M = CFG.MENU_LOOK, w = Math.min(p.w, maxW), dim = p.extra.open === false;
  rr(x, y, w, p.h, p.h * 0.4); fillStroke(p.bg || (dim ? M.locked : M.pill), (PHONE ? cpx(1) : 1) * M.pillLine, M.ink);
  if (p.pic) p.pic(x + p.pad + p.ps * 0.65, y + p.h / 2, p.ps);
  const f = fitLine(p.text, p.size, p.min, w - p.picW - 2 * p.pad);
  plainText(f.text, x + p.pad + p.picW, y + p.h / 2 + 1, f.sz, p.ink || (dim ? M.lockedInk : M.ink));
  if (PHONE) noteText("main", f.sz);

// плашки рядами в ширину maxW (по центру или слева); не влезла — следующий ряд; возвращает низ последнего ряда
function pillRows(pills, x0, maxW, y, gap, rowGap, center) {
  let row = [], w = 0, bottom = y;
  const flush = () => {
    if (!row.length) return;
    let x = center ? x0 + (maxW - w) / 2 : x0;
    for (const p of row) { drawPill(p, x, y, maxW); x += Math.min(p.w, maxW) + gap; }
    bottom = y + row[0].h; y = bottom + rowGap; row = []; w = 0;
  };
  for (const p of pills) {
    const pw = Math.min(p.w, maxW);
    if (row.length && w + gap + pw > maxW) flush();
    w += (row.length ? gap : 0) + pw; row.push(p);
  }
  flush();
  return bottom;
}

      // четыре карточки в ряд: рукавицы, мега-рукавицы, воздушные поцелуи, спасалка (SPEC-007). Сверху картинка, название,
      // описание; снизу (к кнопке) набор и «у вас»; кнопки «Купить» на одной высоте, под ними «не хватает монеток».
      // Места мало (узкий телефон, широкий шрифт, длинные тексты) — уступаем по шагам, теряя как можно меньше (AC 10):
      // 1) картинка меньше; 2) «у вас» → кружок с числом у картинки; 3) набор коротко («📦 ×3»); 4) описание теряет строки («…»).
      const S = CFG.PHONE_SHOP, cards = shopCards(), cg = c(8), nC = cards.length, cw = (X1 - X0 - (nC - 1) * cg) / nC, tw = cw - 2 * c(S.side);
      const y0 = Y0 + B + cg, ch = Y1 - B - g - y0, pad = c(S.pad), sp = c(S.sp), bw = Math.min(c(160), cw - c(10)), eps = S.eps;
      let br = c(S.badge);
      const bl = cards.map(cd => ({ name: clipRows(pRows(cd.name, "main", 15, tw, S.nameLines, 900), S.nameLines),
        desc: clipRows(pRows(cd.desc, "hint", 13, tw, S.descLines, 700), S.descLines),
        pack: clipRows(pRows(cd.pack, "hint", 13, tw, S.packLines, 600), S.packLines),
        packShort: clipRows(pRows(L().packShort(cd.packN), "hint", 13, tw, S.shortLines, 600), S.shortLines),
        have: clipRows(pRows(cd.have, "hint", 13, tw, S.haveLines, 800), S.haveLines),
        no: progress.coins >= cd.price ? null : clipRows(pRows(L().notEnough, "hint", 13, tw, S.noLines, 700), S.noLines) }));
      const noH = Math.max(0, ...bl.map(b => b.no ? b.no.h + sp : 0));
      const by = y0 + ch - pad - noH - B;                                      // кнопки «Купить» — одна высота
      const avail = by - sp - (y0 + pad);                                      // картинка и тексты над кнопкой
      const rowH = (p, m) => Math.max(p * S.picBox, m.badge ? 2 * br : 0);     // верхний ряд: картинка (и кружок рядом)
      const packOf = (b, m) => m.short ? b.packShort : b.pack;
      const lowH = (b, m) => packOf(b, m).h + (m.badge ? 0 : b.have.h);
      const slackOf = (b, p, m) => avail - rowH(p, m) - sp - b.name.h - b.desc.h - sp - lowH(b, m);
      const slack = (p, m) => Math.min(...bl.map(b => slackOf(b, p, m)));
      const steps = [{ badge: false, short: false }, { badge: true, short: false }, { badge: true, short: true }];
      const pBase = c(S.pic), pMin = c(S.picMin);
      let m = steps[0], picH = pBase;
      if (slack(pBase, m) >= 0) picH = pBase + Math.min(c(S.picGrow), slack(pBase, m) / S.picBox);   // место есть — картинка крупнее
      else {
        let found = null;                                                      // самая крупная картинка, при которой всё влезает
        for (const st of steps) {
          m = st;
          for (let p = pBase; p >= pMin - eps && found === null; p -= c(S.scan)) if (slack(p, m) >= 0) found = p;
          if (found !== null) break;
        }
        picH = found ?? pMin;
      }
      // шаг: 0 — всё полностью, 1 — кружок «у вас», 2 — и набор коротко, 3 — описание/название обрезаны, 4 — последний шаг
      let stepUsed = steps.indexOf(m);
      // всё ещё тесно (очень широкий шрифт) — описание теряет строки, потом название — до одной строки
      const cutRows = (b, key, min, over) => {
        if (over <= eps) return over;
        const t = b[key], keep = Math.max(min, t.rows.length - Math.ceil(over / t.lh - eps));
        if (keep < t.rows.length) { b[key] = clipRows(t, keep); stepUsed = Math.max(stepUsed, 3); }
        return over - (t.h - b[key].h);
      };
      bl.forEach(b => { let over = -slackOf(b, picH, m); over = cutRows(b, "desc", 0, over); cutRows(b, "name", 1, over); });
      // последний шаг — всегда без наложений: кружок не выше картинки, набор — до одной строки и совсем без него,
      // и (только если и это не помогло) картинка меньше своего минимума
      if (slack(picH, m) < -eps) {
        stepUsed = 4;
        if (m.badge) br = Math.max(c(S.badgeMin), Math.min(br, picH * S.picBox / 2));
        const pk = m.short ? "packShort" : "pack";
        bl.forEach(b => { let over = -slackOf(b, picH, m); over = cutRows(b, pk, 1, over); cutRows(b, pk, 0, over); });
        if (slack(picH, m) < -eps) { picH = Math.max(c(S.scan), picH + slack(picH, m) / S.picBox); if (m.badge) br = Math.min(br, picH * S.picBox / 2); }
      }
      stepUsed = Math.max(stepUsed, 0);
      shopLayout = { step: stepUsed, badge: m.badge, short: m.short, picH: picH / cpx(1), badgeR: br / cpx(1),
        packs: bl.map(b => packOf(b, m).rows.join(" ")) };
      const top = rowH(picH, m);
      const box = (id, b, x, y) => { if (b.rows.length) hudRects.push({ id, x: x - b.w / 2, y, w: b.w, h: b.h }); };   // части карточек: тест проверяет, что не налезают
      cards.forEach((cd, i) => {
        const x0 = X0 + i * (cw + cg), cx = x0 + cw / 2, b = bl[i];
        rr(x0, y0, cw, ch, c(16)); fillStroke("#fff", 3);
        const pcy = y0 + pad + top / 2, pw = picH * S.picW, ph = picH * S.picBox;
        shopPicture(cd.k, cx, pcy, picH);
        hudRects.push({ id: "card-pic:" + cd.k, x: cx - pw / 2, y: pcy - ph / 2, w: pw, h: ph });
        if (m.badge) {                                                         // сколько есть — кружок с числом справа от картинки
          const bx = cx + pw / 2 + c(S.gap) + br;
          circle(bx, pcy, br); fillStroke(cd.n > 0 ? "#16a34a" : "#94a3b8", 2.5);
          noteText("hint", fitText(String(cd.n), bx, pcy + 1, minPx("hint"), br * 1.7, "center", "#fff", 900, minPx("hint")));
          hudRects.push({ id: "card-badge:" + cd.k, x: bx - br, y: pcy - br, w: 2 * br, h: 2 * br });
        }
        let y = y0 + pad + top + sp;
        box("card-name:" + cd.k, b.name, cx, y); y += pDraw(b.name, cx, y, OUT);
        box("card-desc:" + cd.k, b.desc, cx, y); pDraw(b.desc, cx, y, "#475569");
        let yl = by - sp - (m.badge ? 0 : b.have.h);
        if (!m.badge) { box("card-have:" + cd.k, b.have, cx, yl); pDraw(b.have, cx, yl, cd.n > 0 ? "#15803d" : "#94a3b8"); }
        const pk = packOf(b, m);
        yl -= pk.h;
        box("card-pack:" + cd.k, pk, cx, yl); pDraw(pk, cx, yl, "#64748b");
        const ok = !b.no, txt = `${L().buy}  ${cd.price}      `;
        const btn = pButton(cx - bw / 2, by, bw, B, txt, ok ? "#22c55e" : "#cbd5e1", cd.buy, 17);
        btn.id = "buy:" + cd.k;
        ctx.font = hudFont(btn.size);
        const vis = ctx.measureText(`${L().buy}  ${cd.price}`).width, full = ctx.measureText(txt).width;
        drawCoin(cx - full / 2 + vis + c(14), by + B / 2, c(9));                // монетка после цены
        if (b.no) { const ny = by + B + sp; box("card-no:" + cd.k, b.no, cx, ny); pDraw(b.no, cx, ny, "#ef4444"); }
      });
      // кто что надевает (на телефоне — только игрок 1)
      const wy = y0 + ch + g, wl = `${L().player1} ${L().wears}:`;
      pLabel(wl, X0 + c(4), wy + B / 2, "main", 17, P_COLORS[0], "left");
      const lw = ctx.measureText(wl).width;
      ["none", "mittens", "mega"].forEach((k, j) => {
        const on = progress.equip[0] === k, bw = c(118), bx = X0 + c(4) + lw + c(16) + j * (bw + g);
        addButton(bx, wy, bw, B, k === "none" ? L().none : "", on ? "#ff6fa8" : "#cbd5e1", () => setEquip(0, k), fz(16, "main"));
        if (k !== "none") { drawMitten(bx + c(28), wy + B / 2, c(26), k); pLabel("×" + progress.inv[k], bx + c(72), wy + B / 2, "main", 16, "#fff"); }
      });
    }
  } else if (mode === "pause") {
    const bw = c(170), bh = c(60), g = c(16), acts = pauseActions();
    pLabel(L().pause, UW / 2, UH / 2 - c(56), "title", 44, "#fff");
    let bx = UW / 2 - (acts.length * bw + (acts.length - 1) * g) / 2;
    for (const [txt, col, act] of acts) { pButton(bx, UH / 2, bw, bh, txt, col, act, 22); bx += bw + g; }
  } else if (mode === "win" || mode === "lose") {
    // слева — заголовок и звёзды, справа — итоги и монетки, внизу — кнопки
    const { X0, X1, Y0, Y1, g } = phoneFrame(false), lx = X0 + (X1 - X0) * 0.27, rx = X0 + (X1 - X0) * 0.72, colW = (X1 - X0) * 0.44;
    const rw = lastReward || { stars: 1, coins: 0, nobodyOut: false, fast: false, target: 0 }, bh = c(56);
    let acts;
    if (mode === "win") {
      // слева: заголовок, строка под ним, звёзды и за что они; справа — строки награды и итог (SPEC-009)
      pLabel(L().win, lx, Y0 + c(30), "title", 40, "#ffcf33", "center", colW);
      pWrap(winText(), lx, Y0 + c(58), "main", 16, colW, 2, "#fff", 900);
      for (let k = 0; k < CFG.STARS_PER_LEVEL; k++) drawStar(lx - c(56) + k * c(56), Y0 + c(138), c(21), k < rw.stars);
      [[true, L().victory], [rw.nobodyOut, L().nobodyOut], [rw.fast, L().fast(fmtTime(rw.target))]].forEach(([okk, txt], i) => {
        pLabel((okk ? "✔ " : "✘ ") + txt, lx, Y0 + c(178) + i * c(26), "main", 15, okk ? "#bbf7d0" : "#cbd5e1", "center", colW);
      });
      drawRewardLines(rw, rx - colW / 2, Y0 + c(14), colW, c(28), c(17), cpx(CFG.PHONE_TEXT.main), c(26), cpx(CFG.PHONE_TEXT.title));
      acts = endActions("win").map((a, i) => [...a, c([200, 150, 150][i])]);
      // SPEC-016: под строками звёзд и наградой, над кнопками, по центру экрана — во всю ширину (испанский текст в левую колонку не влезал)
      drawBonusNote(UW / 2, Math.min(Y0 + c(262), Y1 - bh - g - c(15)), X1 - X0 - 2 * g, c(28), 15);
    } else {
      pLabel(L().lose, lx, Y0 + c(40), "title", 36, "#fca5a5", "center", colW);
      pWrap(L().loseSub(fmtHearts(big.maxHp - big.hp), big.maxHp), lx, Y0 + c(70), "main", 17, colW, 3, "#fff", 900);
      const sc = lastReward ? lastReward.starCoins || 0 : 0, hugCoins = lastReward ? lastReward.coins - sc : 0;
      if (hugCoins > 0) { drawCoin(rx - c(70), Y0 + c(60), c(12)); pLabel(L().forHugs(hugCoins), rx - c(50), Y0 + c(60), "main", 18, "#fde047", "left", colW - c(30)); }
      if (sc > 0) pLabel("✨ " + L().starCoins(sc), rx, Y0 + c(90), "main", 16, "#fde047", "center", colW);
      acts = endActions("lose").map((a, i) => [...a, c([180, 150, 150][i])]);
    }
    const total = acts.reduce((s, a) => s + a[3], 0) + g * 1.5 * (acts.length - 1);
    let bx = UW / 2 - total / 2;
    for (const [txt, col, act, w] of acts) { pButton(bx, Y1 - bh, w, bh, txt, col, act, 22); bx += w + g * 1.5; }
  }
}

        });

    if (shopTab === "wardrobe") {

      const W = CFG.MENU_LOOK.wardrobe, fr = wardrobePage === "friends";

    const acts = endActions("win");
    const geo = acts.length === 3 ? [[UW / 2 - 360, 440, 260, 66, 24], [UW / 2 - 85, 440, 200, 66, 22], [UW / 2 + 130, 440, 200, 66, 22]]
      : [[UW / 2 - 240, 440, 260, 66, 24], [UW / 2 + 40, 440, 200, 66, 22]];
    acts.forEach(([txt, col, act], i) => { const [x, y, w, h, sz] = geo[i]; addButton(x, y, w, h, txt, col, act, sz); });
  } else if (mode === "lose") {
    label(L().lose, UW / 2, UH / 2 - 100, 58, "#fca5a5");

    const sc = lastReward ? lastReward.starCoins || 0 : 0, hugCoins = lastReward ? lastReward.coins - sc : 0;

    if (sc > 0) label("✨ " + L().starCoins(sc), UW / 2, UH / 2 + (hugCoins > 0 ? 22 : 0), 16, "#fde047");
    const geo = [[UW / 2 - 360, UH / 2 + 40, 240, 66], [UW / 2 - 100, UH / 2 + 40, 200, 66], [UW / 2 + 120, UH / 2 + 40, 240, 66]];
    endActions("lose").forEach(([txt, col, act], i) => { const [x, y, w, h] = geo[i]; addButton(x, y, w, h, txt, col, act, 22); });
  }
}

// Подпись с именем: прямоугольник-кнопка с ✏️; тап открывает поле ввода ровно на её месте
function nameLabel(rect, slot, color) {
  rr(rect.x, rect.y, rect.w, rect.h, 12); fillStroke("#f8fafc", 3);
  if (PHONE) {
    const min = cpx(CFG.PHONE_TEXT.main);
    noteText("main", fitText(nameFor(slot) + " ✏️", rect.x + rect.w / 2, rect.y + rect.h / 2 + 1, Math.max(min, Math.min(cpx(20), rect.h * 0.5)), rect.w - cpx(12), "center", color, 900, min));
    buttons.push({ ...rect, act: () => openNameInput(rect, slot), id: "name:" + slot, onUp: true, textW: ctx.measureText(nameFor(slot) + " ✏️").width });
    return;
  } else fitText(nameFor(slot) + " ✏️", rect.x + rect.w / 2, rect.y + rect.h / 2 + 1, Math.min(22, rect.h * 0.5), rect.w - 16, "center", color, 900);
  buttons.push({ ...rect, act: () => openNameInput(rect, slot), id: "name:" + slot, onUp: true });
}

// прямоугольник героя на экране (UI px): от ног до имени над головой (playerNameTag, как в drawMarkers), шириной с тело или имя
function heroScreenRect(l) {
  const P = CFG.PHONE_BANNER, tag = playerNameTag(l), head = tag.hd, feet = toScreen(l.x, l.y);
  const side = P.heroSide * Math.max(Math.abs(toScreen(l.x + l.r, l.y).x - feet.x), Math.abs(toScreen(l.x + l.r, l.y, CFG.NAME_TAG.h).x - head.x));
  ctx.font = hudFont(tag.size);
  const nw = ctx.measureText(nameOf(l)).width + tag.stroke;   // с обводкой
  const x0 = Math.min(feet.x - side, tag.x - nw / 2), x1 = Math.max(feet.x + side, tag.x + nw / 2);
  const y0 = tag.y - tag.size * P.heroText, y1 = feet.y + side * P.heroFeet;
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
// место надписи уровня на телефоне (SPEC-006 AC 13): в той половине экрана, где нет героя — сверху под верхней полосой
// или снизу над подсказкой; по центру самого широкого свободного места, в стороне (PHONE_BTN_GAP) от мини-карты,

// Украшения стен лабиринта по клеткам — одним InstancedMesh: кочки изгороди, столбики забора, снежки, дверцы шкафчиков
function mazeDeco(place, walls) {
  const m = THEMES[place].maze, pts = [];
  for (const o of walls) {
    const n = Math.max(o.w, o.h) / CELL, alongX = o.w >= o.h;
    for (let k = 0; k <= n; k++) {
      if (m.deco === "seams" && (k === 0 || k === n)) continue;
      if ((m.deco === "bumps" || m.deco === "snow" || m.deco === "boards") && k === n) continue;
      const off = m.deco === "bumps" || m.deco === "snow" || m.deco === "boards" ? k + 0.5 : k;
      pts.push([P(o.x) + (alongX ? off : 0.5), P(o.y) + (alongX ? 0.5 : off), alongX]);
    }
  }
  if (!pts.length) return;
  const geo = m.deco === "bumps" ? sphere(0.36, 10, 8) : m.deco === "snow" ? sphere(0.3, 10, 8)
    : m.deco === "posts" ? new THREE.BoxGeometry(0.16, WALL_H + 0.14, 1.08)
    : m.deco === "boards" ? new THREE.BoxGeometry(0.86, WALL_H * 0.5, 1.06) : new THREE.BoxGeometry(0.035, WALL_H * 0.8, 1.04);
  const inst = tag(new THREE.InstancedMesh(geo, toon(m.decoC), pts.length), "mazeDeco");
  const mtx = new THREE.Matrix4(), rot = new THREE.Matrix4().makeRotationY(Math.PI / 2), col = new THREE.Color();
  const y = m.deco === "bumps" ? WALL_H + 0.02 : m.deco === "snow" ? WALL_H + 0.04 : m.deco === "posts" ? (WALL_H + 0.14) / 2 : m.deco === "boards" ? WALL_H * 0.42 : WALL_H * 0.45;
  // SPEC-016: рекламные щиты на изгороди — цвет щита по очереди из deco.boards (умножается на decoC = белый)
  const boards = m.deco === "boards" ? THEMES[place].deco.boards : null;
  pts.forEach(([x, z, alongX], i) => {
    mtx.makeTranslation(x, y, z); if ((m.deco === "seams" || m.deco === "posts" || boards) && !alongX) mtx.multiply(rot);
    inst.setMatrixAt(i, mtx); if (boards) inst.setColorAt(i, col.set(boards[i % boards.length]));
  });
  inst.castShadow = true; mapGroup.add(inst);
}

window.__bbReady = true;
let last = performance.now(), T = 0;
function frame(now) {
  // первая метка rAF бывает раньше performance.now() при запуске: dt < 0 раскачивал тряску камеры (shake − dt) — не меньше 0
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  if (simMode) { requestAnimationFrame(frame); return; }   // sim: ни логики, ни рисования — игру шагает simRun
  T += dt;
  pollPads();
  if (!inWardrobe() && endTryOn()) resetWorld(numPlayers);   // SPEC-009/017: ушли из вкладки «Гардероб» (друзья — её часть) — примерка кончилась
  const portrait = isTouch && window.innerHeight > window.innerWidth;
  if (toast && (toast.t -= dt) <= 0) toast = null;   // SPEC-017: подсказка на карте гаснет сама
  if (mode === "play" && !portrait) update(dt);
  else { updateFx(dt); if (inMenus()) big.dir += dt * 0.8; }
  noGameRng("render", () => {              // рисование не тянет игровую случайность (SPEC-008: тесты — ошибка, игра — vrand)
    updateCamera(dt);                       // телефон: камера за героем (3D-слой, не логика)
    updateMinimapFade(dt);                  // телефон: мини-карта бледнеет, когда под ней герой или Большой (SPEC-010)
    render3D(T);
    drawUI(T);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Офлайн-кэш (sw.js): только по http(s). С диска (file://) и на странице claude.ai — ничего не делаем и молчим.
function registerServiceWorker() {
  try {
    if ((location.protocol === "http:" || location.protocol === "https:") && navigator.serviceWorker) {
      navigator.serviceWorker.register("sw.js").catch(() => { /* регистрацию запретили — игра работает и так */ });
    }
  } catch (e) { /* нет доступа к serviceWorker */ }
}
registerServiceWorker();

  get rngDraws() { return rngDraws; },   // SPEC-008: сколько раз тянули игровую случайность
  setProgress(save) { rewardDue = false; progress = loadProgress(save); },   // SPEC-008 (баланс): прогресс из сохранения (null — новый), не записывает
  levelsPerWorld,
  autopilot, autoThink,   // SPEC-008: autopilot(on, "careful"|"reckless") → { on, style }; autoThink(dt) — только решение (для теста)
  get strictRng() { return strictRng; }, set strictRng(v) { strictRng = !!v; },   // SPEC-008: тесты — генератор/3D с игровым rng() падает
  // SPEC-008 AC 10: карточки магазина простыми данными (без функций); picture — у карточки есть картинка

  loadProgress,   // SPEC-018 (тесты): чистая функция «сохранение → прогресс», та же, что при запуске; игру не трогает

  phone: PHONE, get shake() { return shake; },
