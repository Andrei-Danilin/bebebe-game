<div id="wrap">

  // Если 3D-движок не загрузился (нет интернета) — покажем подсказку
  setTimeout(function () {
    if (!window.__bbReady) {
      var el = document.getElementById("loading");

}

    if (!gap) { if (run === null) run = y; }

// Уровень — (мир, n) (SPEC-006): четыре мира по CFG.WORLD_TYPES.length уровней; место (тема) уровня — его мир
const WORLDS = ["park", "school", "beach", "winter"];
const worldIndex = world => Math.max(0, WORLDS.indexOf(world));
const levelsPerWorld = () => CFG.WORLD_TYPES.length;
const levelPos = n => clamp(Math.floor(n) || 1, 1, levelsPerWorld()) - 1;
const levelKey = (world, n) => world + ":" + n;
// Тип уровня — по списку CFG.WORLD_TYPES (одинаковый во всех мирах)
const levelType = (world, n) => CFG.WORLD_TYPES[levelPos(n)];
// tier — номер уровня внутри своего блока одного типа (0, 1, 2, 3): чем дальше, тем меньше укрытий
function levelTier(world, n) {
  const T = CFG.WORLD_TYPES, i = levelPos(n);
  let t = 0;
  for (let k = i; k > 0 && T[k - 1] === T[i]; k--) t++;
  return t;
}
// Сид: 1-й уровень — рисунок детей, во всех мирах одна и та же раскладка (сид 1, как раньше у уровня 1);
// дальше сид от (номер мира, n) — у каждого мира свои карты
const levelSeed = (world, n) => n <= 1 ? 1 : (worldIndex(world) + 1) * 100 + n;

// Дверь дома (x0, y0, w×h) в виде проёма в клетках + направление наружу (dx, dy)
function houseDoor(x0, y0, w, h, d) {
  if (d.side === "top") return { x: x0 + d.at, y: y0, w: 2, h: 1, dx: 0, dy: -1 };
  if (d.side === "bottom") return { x: x0 + d.at, y: y0 + h - 1, w: 2, h: 1, dx: 0, dy: 1 };
  if (d.side === "left") return { x: x0, y: y0 + d.at, w: 1, h: 2, dx: -1, dy: 0 };
  return { x: x0 + w - 1, y: y0 + d.at, w: 1, h: 2, dx: 1, dy: 0 };
}
// Домики (до зеркала): маленьких 7×6 слева вверху (двери справа и снизу, безопасная зона, кроватки, места);
// дом Большого 6×6 через bigHouse() — слева внизу ("side", как на рисунке) или справа внизу ("diagonal").
// Перед каждой дверью DOOR_APRON клеток заняты (reserve) — туда раскладка ничего не ставит.
function placeHomes(lc, variant) {
  const { items, hWall, vWall, reserve } = lc, A = CFG.DOOR_APRON;
  hWall(0, 6, 0, "home"); hWall(0, 6, 5, "home", [2]); vWall(0, 1, 4, "home"); vWall(6, 1, 4, "home", [2]);
  items.push({ t: "floor", x: 1, y: 1, w: 5, h: 4, kind: "wood" });
  items.push({ t: "decor", kind: "bed", x: 1, y: 1, w: 1, h: 1, c: "#7cc6fe" });
  items.push({ t: "decor", kind: "bed", x: 3, y: 1, w: 1, h: 1, c: "#ffb86b" });
  items.push({ t: "decor", kind: "bed", x: 5, y: 1, w: 1, h: 1, c: "#c3a6ff" });
  lc.small = [[1.5, 3.5], [2.5, 2.5], [3.5, 3.5], [4.5, 2.5], [5.5, 3.5]];
  items.push({ t: "safe", x: 0, y: 0, w: 7, h: 6 });
  lc.doors.small = [{ side: "right", at: 2 }, { side: "bottom", at: 2 }].map(d => houseDoor(0, 0, 7, 6, d));
  reserve(0, 0, 7 + A, 6 + A);

  const diag = variant === "diagonal", x0 = diag ? COLS - BIG_HOUSE : 0, y0 = ROWS - BIG_HOUSE;
  const bigDoors = [{ side: "top", at: 2 }, { side: diag ? "left" : "right", at: 2 }];
  bigHouse(items, x0, y0, bigDoors);
  lc.bigPt = [x0 + 3, y0 + 2];
  lc.doors.big = bigDoors.map(d => houseDoor(x0, y0, BIG_HOUSE, BIG_HOUSE, d));
  reserve(diag ? x0 - A : x0, y0 - A, BIG_HOUSE + A, BIG_HOUSE + A);
  lc.homes = { variant, small: { x: 0, y: 0, w: 7, h: 6 }, big: { x: x0, y: y0, w: BIG_HOUSE, h: BIG_HOUSE } };
}

// ---------- Раскладки ----------
// Раскладки по типам: получают lc с уже построенными домиками и раскладывают остальное (до зеркала)
// 1-й уровень (рисунок детей): здание с комнатами справа, лужа, ёлки, камни, кусты
function classicLayout(lc) {
  const { lv, rng, ri, items, reserve, isFree, place, hWall, vWall } = lc;
  // Здание с комнатами
  const bw = ri(9, 11), bx = COLS - bw, by = ri(0, 2), bh = ri(13, ROWS - by), bb = by + bh - 1;
  const hy = by + Math.floor(bh / 2) + ri(-1, 1);
  const topDoor = by > 0 ? ri(bx + 2, COLS - 4) : -10;
  const botDoor = bb < ROWS - 1 ? ri(bx + 2, COLS - 4) : -10;
  hWall(bx, COLS - 1, by, "build", by > 0 ? [topDoor] : []);
  hWall(bx, COLS - 1, bb, "build", bb < ROWS - 1 ? [botDoor] : []);
  vWall(bx, by + 1, bb - 1, "build", [ri(by + 2, hy - 3), ri(hy + 2, bb - 3)]);
  vWall(COLS - 1, by + 1, bb - 1, "build");
  const hDoor = ri(bx + 2, COLS - 4);
  hWall(bx + 1, COLS - 2, hy, "build", [hDoor]);
  const tryV = (y1, y2, doorX) => {
    if (rng() < 0.35 || y2 - y1 + 1 < 4) return;
    const vx = ri(bx + 3, COLS - 4);
    if ([doorX, doorX + 1, hDoor, hDoor + 1].includes(vx)) return;
    vWall(vx, y1, y2, "build", [ri(y1, y2 - 1)]);
  };
  tryV(by + 1, hy - 1, topDoor);
  tryV(hy + 1, bb - 1, botDoor);
  items.push({ t: "floor", x: bx + 1, y: by + 1, w: bw - 2, h: bh - 2, kind: "tile" });
  reserve(bx - 3, by - 2, bw + 3, bh + 4);

  // Природа
  if (rng() < 0.5 || lv % 3 === 0) {
    for (let k = 0; k < 80; k++) {
      const w = ri(3, 4), h = 2, x = ri(1, COLS - w - 1), y = ri(1, ROWS - h - 1);
      if (isFree(x, y, w, h, 2)) { items.push({ t: "pond", x, y, w, h }); reserve(x, y, w, h); break; }
    }
  }
  place(Math.min(15, 7 + lv), (x, y) => ({ t: "tree", x, y, v: rng() < 0.6 ? "pine" : "round", s: 0.9 + rng() * 0.25 }));
  place(ri(2, 4), (x, y) => ({ t: "rock", x, y, s: 0.9 + rng() * 0.3 }));
  place(ri(3, 5), (x, y) => ({ t: "bush", x, y }), 2, 2, 0);
}
// общие кусочки раскладок
// Клетки стен (сетка COLS×ROWS) → прямоугольники-стены kind: сначала горизонтальные отрезки ≥ 2, остальное — вертикальными;
// клетки стен занимаются в occ
function emitWalls(items, occ, wall, kind) {
  const used = new Uint8Array(COLS * ROWS);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!wall[y * COLS + x] || used[y * COLS + x]) continue;
    let e = x; while (e + 1 < COLS && wall[y * COLS + e + 1]) e++;
    if (e > x) { items.push({ t: "wall", x, y, w: e - x + 1, h: 1, kind }); for (let k = x; k <= e; k++) used[y * COLS + k] = 1; }
  }
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
    if (!wall[y * COLS + x] || used[y * COLS + x]) continue;
    let e = y; while (e + 1 < ROWS && wall[(e + 1) * COLS + x] && !used[(e + 1) * COLS + x]) e++;
    items.push({ t: "wall", x, y, w: 1, h: e - y + 1, kind }); for (let k = y; k <= e; k++) used[k * COLS + x] = 1;
  }
  for (let k = 0; k < COLS * ROWS; k++) if (wall[k]) occ[k] = 1;
}
const shuffle = (rng, a) => { for (let k = a.length - 1; k > 0; k--) { const r = Math.floor(rng() * (k + 1)); [a[k], a[r]] = [a[r], a[k]]; } return a; };
const genTree = rng => (x, y) => ({ t: "tree", x, y, v: rng() < 0.6 ? "pine" : "round", s: 0.9 + rng() * 0.25 });
const genRock = rng => (x, y) => ({ t: "rock", x, y, s: 0.9 + rng() * 0.3 });
const genBush = (x, y) => ({ t: "bush", x, y });
const bushCount = (lc, [a, b]) => Math.max(CFG.BUSH_MIN[lc.type], lc.ri(a, b) - lc.tier);

// Поляна: никаких зданий — кусты, деревья, камни и маленькие лужи
function meadowLayout(lc) {
  const { rng, ri, items, reserve, isFree, place } = lc, L = CFG.LAYOUT.meadow;
  for (let n = ri(L.ponds[0], L.ponds[1]); n > 0; n--) for (let k = 0; k < 80; k++) {
    const w = ri(L.pondW[0], L.pondW[1]), h = 2, x = ri(1, COLS - w - 1), y = ri(1, ROWS - h - 1);
    if (isFree(x, y, w, h, 2)) { items.push({ t: "pond", x, y, w, h }); reserve(x, y, w, h); break; }
  }
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
  place(bushCount(lc, L.bushes), genBush, 2, 2, 1);
}

// Лабиринт из живой изгороди на сетке модулей 3×3 клетки: коридор 2 клетки + стена 1 клетка.
// Модули, задевающие домики с площадками у дверей, — одна открытая «область дома». Сначала идеальный лабиринт
// (Краскал), потом «плетение»: пробиваем стены у тупиков, пока их не останется ≤ MAZE_DEAD_ENDS; плюс 1–2 площади 5×5.
function mazeLayout(lc) {
  const { rng, ri, items, occ, reserve, place } = lc, L = CFG.LAYOUT.maze, M = L.module;
  const MC = Math.floor(COLS / M), MR = Math.ceil(ROWS / M), N = MC * MR;   // 10 × 7; крайние модули доходят до края карты
  const x0 = i => i * M, x1 = i => i === MC - 1 ? COLS - 1 : i * M + M - 2;
  const y0 = j => j * M, y1 = j => j === MR - 1 ? ROWS - 1 : j * M + M - 2;
  const id = (i, j) => j * MC + i;
  // модуль (с его стенами справа и снизу) задевает домик или площадку у двери
  const home = new Uint8Array(N);
  for (let j = 0; j < MR; j++) for (let i = 0; i < MC; i++) {
    for (let y = y0(j); y <= Math.min(ROWS - 1, y0(j) + M - 1); y++) for (let x = x0(i); x <= Math.min(COLS - 1, x0(i) + M - 1); x++) if (occ[y * COLS + x]) home[id(i, j)] = 1;
  }
  const edges = [];
  for (let j = 0; j < MR; j++) for (let i = 0; i < MC; i++) {
    if (i < MC - 1) edges.push({ a: id(i, j), b: id(i + 1, j), i, j, h: true, open: false });
    if (j < MR - 1) edges.push({ a: id(i, j), b: id(i, j + 1), i, j, h: false, open: false });
  }
  const edgeOf = (a, b) => edges.find(e => (e.a === a && e.b === b) || (e.a === b && e.b === a));
  const par = Array.from({ length: N }, (_, k) => k);
  const find = a => { while (par[a] !== a) a = par[a] = par[par[a]]; return a; };
  const dg = new Uint8Array(N);   // сколько проходов у модуля
  const openE = e => { if (!e.open) { e.open = true; dg[e.a]++; dg[e.b]++; } };
  const join = e => { const a = find(e.a), b = find(e.b); if (a === b) return false; par[a] = b; openE(e); return true; };
  // области домов — открыты внутри
  for (const e of edges) if (home[e.a] && home[e.b]) { join(e); openE(e); }
  // площади: блок 2×2 модуля (5×5 клеток), не в широком крайнем столбце, не на доме и не рядом с другой площадью
  const plaza = new Uint8Array(N), plazas = [];
  const want = ri(L.plazas[0], L.plazas[1]);
  for (let k = 0; k < 60 && plazas.length < want; k++) {
    const i = ri(0, MC - 3), j = ri(0, MR - 2);
    let ok = true;
    for (let dj = -1; dj <= 2 && ok; dj++) for (let di = -1; di <= 2 && ok; di++) {
      const a = i + di, b = j + dj;
      if (a < 0 || b < 0 || a >= MC || b >= MR) continue;
      const inside = di >= 0 && di <= 1 && dj >= 0 && dj <= 1;
      if ((inside && home[id(a, b)]) || plaza[id(a, b)]) ok = false;
    }
    if (!ok) continue;
    for (const [di, dj] of [[0, 0], [1, 0], [0, 1], [1, 1]]) plaza[id(i + di, j + dj)] = 1;
    for (const [a, b] of [[id(i, j), id(i + 1, j)], [id(i, j + 1), id(i + 1, j + 1)], [id(i, j), id(i, j + 1)], [id(i + 1, j), id(i + 1, j + 1)]]) { const e = edgeOf(a, b); join(e); openE(e); }
    plazas.push({ i, j, x: x0(i), y: y0(j), w: x1(i + 1) - x0(i) + 1, h: y1(j + 1) - y0(j) + 1 });
  }
  // идеальный лабиринт
  const order = edges.filter(e => !e.open);
  for (let k = order.length - 1; k > 0; k--) { const r = Math.floor(rng() * (k + 1)); [order[k], order[r]] = [order[r], order[k]]; }
  for (const e of order) join(e);
  // тупики: обычный модуль с одним проходом
  const deg = m => dg[m];
  const deadList = () => { const r = []; for (let m = 0; m < N; m++) if (!home[m] && !plaza[m] && deg(m) === 1) r.push(m); return r; };
  let dead = deadList();
  const before = dead.length, target = Math.floor(before * CFG.MAZE_DEAD_ENDS);
  for (let k = dead.length - 1; k > 0; k--) { const r = Math.floor(rng() * (k + 1)); [dead[k], dead[r]] = [dead[r], dead[k]]; }
  for (const m of dead) {
    if (deadList().length <= target) break;
    if (deg(m) !== 1) continue;
    const closed = edges.filter(e => !e.open && (e.a === m || e.b === m));
    if (!closed.length) continue;
    const other = e => e.a === m ? e.b : e.a;
    const pick = closed.find(e => !home[other(e)] && !plaza[other(e)] && deg(other(e)) === 1) || closed[Math.floor(rng() * closed.length)];
    openE(pick);
  }
  lc.meta.deadEndsBefore = before;
  lc.meta.deadEndsAfter = deadList().length;
  // стены в клетки (кроме домиков и площадок у дверей)
  const wall = new Uint8Array(COLS * ROWS);
  const put = (x, y) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS && !occ[y * COLS + x]) wall[y * COLS + x] = 1; };
  for (const e of edges) {
    if (e.open) continue;
    if (e.h) for (let y = y0(e.j); y <= y1(e.j); y++) put(x1(e.i) + 1, y);
    else for (let x = x0(e.i); x <= x1(e.i); x++) put(x, y1(e.j) + 1);
  }
  for (let j = 0; j < MR - 1; j++) for (let i = 0; i < MC - 1; i++) {   // столбики на перекрёстках
    const near = [edgeOf(id(i, j), id(i + 1, j)), edgeOf(id(i, j + 1), id(i + 1, j + 1)), edgeOf(id(i, j), id(i, j + 1)), edgeOf(id(i + 1, j), id(i + 1, j + 1))];
    if (near.some(e => !e.open)) put(x1(i) + 1, y1(j) + 1);
  }
  emitWalls(items, occ, wall, "maze");
  // деревья — в центрах площадей, кусты — по одному на площадь, остальные — в широких местах коридоров
  const trees = Math.min(plazas.length, ri(L.trees[0], L.trees[1])), tree = genTree(rng);
  for (let k = 0; k < trees; k++) { const q = plazas[k], cx = q.x + 2, cy = q.y + 2; items.push(tree(cx, cy)); reserve(cx, cy, 1, 1); }
  let bushes = bushCount(lc, L.bushes);
  for (const q of plazas) {
    if (bushes <= 0) break;
    const c = [[q.x, q.y], [q.x + q.w - 2, q.y], [q.x, q.y + q.h - 2], [q.x + q.w - 2, q.y + q.h - 2]][ri(0, 3)];
    items.push(genBush(c[0], c[1])); reserve(c[0], c[1], 2, 2); bushes--;
  }
  place(bushes, genBush, 2, 2, 0);
  lc.meta.areas = { plazas: plazas.map(q => ({ x: q.x, y: q.y, w: q.w, h: q.h })) };
}

// Деревня: 5–8 домиков-блоков с улицами ≥ 2 клеток вокруг, площадь с фонтаном в середине
function villageLayout(lc) {
  const { rng, ri, items, reserve, isFree, place } = lc, L = CFG.LAYOUT.village, S = L.street;
  const sw = ri(L.squareW[0], L.squareW[1]), sh = ri(L.squareH[0], L.squareH[1]);
  const sx = Math.floor((COLS - sw) / 2) + ri(-1, 1), sy = Math.floor((ROWS - sh) / 2) + ri(-1, 1);
  items.push({ t: "floor", x: sx, y: sy, w: sw, h: sh, kind: "square" });
  const F = L.fountain;
  items.push({ t: "pond", x: sx + Math.floor((sw - F) / 2), y: sy + Math.floor((sh - F) / 2), w: F, h: F, fountain: true });
  reserve(sx, sy, sw, sh);
  const cottages = [], want = ri(L.cottages[0], L.cottages[1]);
  for (let k = 0; k < 800 && cottages.length < want; k++) {
    let w = ri(L.cottageA[0], L.cottageA[1]), h = ri(L.cottageB[0], L.cottageB[1]);
    if (rng() < 0.5) [w, h] = [h, w];
    const x = ri(S, COLS - w - S), y = ri(S, ROWS - h - S);
    if (isFree(x, y, w, h, S)) { const c = { t: "cottage", x, y, w, h }; items.push(c); cottages.push(c); reserve(x, y, w, h); }
  }
  if (cottages.length < L.cottages[0]) lc.meta.bad = "cottages";
  // кусты во дворах — вплотную к домикам
  let bushes = bushCount(lc, L.bushes);
  for (let k = 0; k < 400 && bushes > 0 && cottages.length; k++) {
    const c = cottages[ri(0, cottages.length - 1)], side = ri(0, 3);
    const x = side === 0 ? c.x - 2 : side === 1 ? c.x + c.w : ri(c.x - 1, c.x + c.w - 1);
    const y = side === 2 ? c.y - 2 : side === 3 ? c.y + c.h : ri(c.y - 1, c.y + c.h - 1);
    if (isFree(x, y, 2, 2, 0)) { items.push(genBush(x, y)); reserve(x, y, 2, 2); bushes--; }
  }
  place(bushes, genBush, 2, 2, 0);
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
}

// Река с мостиками: вода 2–3 клетки от края до края между домиками (горизонтально; при доме Большого по диагонали —
// иногда вертикально), каждые 4–6 клеток сдвигается на ±1; 2–3 мостика шириной 2–3 клетки; кусты на обоих берегах
function riverLayout(lc) {
  const { rng, ri, items, reserve, place } = lc, L = CFG.LAYOUT.river, A = CFG.DOOR_APRON;
  const diag = lc.homes.variant === "diagonal", vertical = diag && rng() < 0.5;
  const along = vertical ? ROWS : COLS, w = ri(L.width[0], L.width[1]);
  // полоса между домиками с их площадками у дверей
  const lo = vertical ? lc.homes.small.w + A : lc.homes.small.h + A;
  const hi = vertical ? lc.homes.big.x - A - 1 : lc.homes.big.y - A - 1;
  const maxOff = hi - w + 1, top = new Array(along);
  let off = ri(lo, maxOff);
  for (let pos = 0; pos < along;) {
    const seg = ri(L.bend[0], L.bend[1]);
    for (let k = 0; k < seg && pos < along; k++) top[pos++] = off;
    const d = rng() < 0.5 ? -1 : 1;
    off = off + d >= lo && off + d <= maxOff ? off + d : off - d;
  }
  // мостики: по одному в каждой части реки, на прямом куске; при домах на одной стороне — не у самих домов
  const nb = ri(L.bridges[0], L.bridges[1]), bridge = new Uint8Array(along), bridges = [];
  const minS = !vertical && !diag ? lc.homes.small.w + A + 1 : 1;
  for (let k = 0; k < nb; k++) {
    const bw = ri(L.bridgeW[0], L.bridgeW[1]), p0 = Math.floor(k * along / nb), p1 = Math.floor((k + 1) * along / nb) - 1;
    const cand = [];
    for (let st = Math.max(p0, minS); st + bw - 1 <= Math.min(p1, along - 2); st++) {
      let ok = true;
      for (let q = st; q < st + bw; q++) if (top[q] !== top[st] || bridge[q]) ok = false;
      if (ok && !bridge[st - 1] && !bridge[st + bw]) cand.push(st);
    }
    if (!cand.length) continue;
    const st = cand[ri(0, cand.length - 1)];
    for (let q = st; q < st + bw; q++) bridge[q] = 1;
    bridges.push(vertical ? { x: top[st], y: st, w, h: bw } : { x: st, y: top[st], w: bw, h: w });
  }
  if (bridges.length < L.bridges[0]) lc.meta.bad = "bridges";
  // вода — прямыми кусками без мостиков
  for (let p = 0; p < along;) {
    if (bridge[p]) { p++; continue; }
    let e = p; while (e + 1 < along && !bridge[e + 1] && top[e + 1] === top[p]) e++;
    const r = vertical ? { x: top[p], y: p, w, h: e - p + 1 } : { x: p, y: top[p], w: e - p + 1, h: w };
    items.push({ t: "water", ...r }); reserve(r.x, r.y, r.w, r.h);
    p = e + 1;
  }
  for (const b of bridges) { items.push({ t: "floor", kind: "bridge", ...b, across: vertical ? "x" : "y" }); reserve(b.x, b.y, b.w, b.h); }
  // берег клетки: 0 — сторона домика маленьких, 1 — другая
  const bank = (x, y) => vertical ? (x < top[y] ? 0 : 1) : (y < top[x] ? 0 : 1);
  const nBush = bushCount(lc, L.bushes), half = Math.ceil(nBush / 2);
  place(half, genBush, 2, 2, 0, (x, y) => bank(x, y) === 0);
  place(nBush - half, genBush, 2, 2, 0, (x, y) => bank(x, y) === 1);
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
  lc.meta.areas = { bridges: bridges.map(b => ({ ...b })) };
  lc.meta.vertical = vertical;
}

// Дом с комнатами (дом Большого по диагонали): здание из двух крыльев вокруг двор(ов) домиков — A справа сверху,
// B слева снизу, общая стена между ними. Каждое крыло делится пополам (BSP) на комнаты ≥ 4×4 внутри; в каждой
// стене деления дверь (2 клетки), примерно в трети — вторая; 3–4 двери наружу, в оба двора.
function roomsLayout(lc) {
  const { rng, ri, items, occ, reserve, isFree, place } = lc, L = CFG.LAYOUT.rooms, A = CFG.DOOR_APRON, MR = L.minRoom;
  if (lc.homes.variant !== "diagonal") { lc.meta.bad = "homes"; return; }   // крылья здания — только вокруг домов по диагонали
  const sh = lc.homes.small, bh = lc.homes.big;
  const ax0 = sh.x + sh.w + A, ay1 = bh.y - A - 1;            // крыло A: x ax0..COLS-1, y 0..ay1
  const bx1 = bh.x - A - 1, by0 = ay1;                         // крыло B: x 0..bx1, y by0..ROWS-1 (общая стена y = ay1)
  const wings = [{ x0: ax0, y0: 0, x1: COLS - 1, y1: ay1 }, { x0: 0, y0: by0, x1: bx1, y1: ROWS - 1 }];
  const wall = new Uint8Array(COLS * ROWS), door = new Uint8Array(COLS * ROWS), doors = [];
  const at = (x, y) => y * COLS + x;
  for (const g of wings) {
    for (let x = g.x0; x <= g.x1; x++) { wall[at(x, g.y0)] = 1; wall[at(x, g.y1)] = 1; }
    for (let y = g.y0; y <= g.y1; y++) { wall[at(g.x0, y)] = 1; wall[at(g.x1, y)] = 1; }
  }
  // дверь: 2 клетки в стене; vert — стена вертикальная (дверь сверху вниз)
  const addDoor = (x, y, vert, kind) => {
    const c = vert ? [[x, y], [x, y + 1]] : [[x, y], [x + 1, y]];
    for (const [cx, cy] of c) { wall[at(cx, cy)] = 0; door[at(cx, cy)] = 1; }
    doors.push({ x, y, w: vert ? 1 : 2, h: vert ? 2 : 1, vert, kind });
  };
  const free2 = (vert, x, y, list) => list.every(([cx, cy]) => !door[at(cx, cy)]) && !door[at(vert ? x : x - 1, vert ? y - 1 : y)] && !door[at(vert ? x : x + 2, vert ? y + 2 : y)];
  // двери наружу: стены крыльев, смотрящие во дворы (по 1–2 в каждый двор, всего 3–4)
  const segs = {
    small: [{ vert: true, x: ax0, a: 1, b: ay1 - 1 }, { vert: false, y: by0, a: 1, b: ax0 - 1 }],
    big: [{ vert: false, y: ay1, a: bx1 + 1, b: COLS - 2 }, { vert: true, x: bx1, a: by0 + 1, b: ROWS - 2 }]
  };
  const total = ri(L.outsideDoors[0], L.outsideDoors[1]), perYard = { small: 1, big: 1 };
  perYard[rng() < 0.5 ? "small" : "big"] += total - 2 > 0 ? 1 : 0;
  if (total - 2 > 1) perYard[perYard.small > 1 ? "big" : "small"]++;
  // первая дверь во двор маленьких — напротив правой стены их домика: иначе полоса между домиком и зданием —
  // тупик для Большого (в домик ему нельзя)
  addDoor(ax0, ri(1, sh.h - 2), true, "out:small"); perYard.small--;
  for (const yard of ["small", "big"]) {
    let left = perYard[yard];
    for (let k = 0; k < 80 && left > 0; k++) {
      const sg = segs[yard][ri(0, 1)], st = ri(sg.a, sg.b - 1);
      const x = sg.vert ? sg.x : st, y = sg.vert ? st : sg.y;
      const cells = sg.vert ? [[x, y], [x, y + 1]] : [[x, y], [x + 1, y]];
      if (!free2(sg.vert, x, y, cells)) continue;
      addDoor(x, y, sg.vert, "out:" + yard); left--;
    }
  }
  // общая стена между крыльями: 1 дверь (иногда 2)
  const sharedDoor = () => { for (let k = 0; k < 40; k++) { const x = ri(ax0 + 1, bx1 - 2); if (free2(false, x, ay1, [[x, ay1], [x + 1, ay1]])) { addDoor(x, ay1, false, "in"); return; } } };
  sharedDoor(); if (rng() < L.secondDoor) sharedDoor();
  // BSP: r — внутренность (без стен). Линия деления не упирается в дверь соседней стены.
  const rooms = [];
  const split = r => {
    const w = r.x1 - r.x0 + 1, h = r.y1 - r.y0 + 1;
    const canV = w >= 2 * MR + 1, canH = h >= 2 * MR + 1;
    if ((!canV && !canH) || (w * h <= L.stopArea && rng() < 0.5)) { rooms.push(r); return; }
    const vert = canV && (!canH || (w > h ? rng() < L.splitBias : rng() < 1 - L.splitBias));   // чаще делим длинную сторону
    const opts = [];
    if (vert) { for (let sx = r.x0 + MR; sx <= r.x1 - MR; sx++) if (!door[at(sx, r.y0 - 1)] && !door[at(sx, r.y1 + 1)]) opts.push(sx); }
    else { for (let sy = r.y0 + MR; sy <= r.y1 - MR; sy++) if (!door[at(r.x0 - 1, sy)] && !door[at(r.x1 + 1, sy)]) opts.push(sy); }
    if (!opts.length) { rooms.push(r); return; }
    const sp = opts[ri(0, opts.length - 1)];
    if (vert) for (let y = r.y0; y <= r.y1; y++) wall[at(sp, y)] = 1;
    else for (let x = r.x0; x <= r.x1; x++) wall[at(x, sp)] = 1;
    const a0 = vert ? r.y0 : r.x0, a1 = vert ? r.y1 : r.x1;
    const d1 = ri(a0, a1 - 1);
    if (vert) addDoor(sp, d1, true, "in"); else addDoor(d1, sp, false, "in");
    if (rng() < L.secondDoor) {
      const o = []; for (let d = a0; d <= a1 - 1; d++) if (d + 1 < d1 - 1 || d > d1 + 2) o.push(d);
      if (o.length) { const d2 = o[ri(0, o.length - 1)]; if (vert) addDoor(sp, d2, true, "in"); else addDoor(d2, sp, false, "in"); }
    }
    if (vert) { split({ x0: r.x0, y0: r.y0, x1: sp - 1, y1: r.y1 }); split({ x0: sp + 1, y0: r.y0, x1: r.x1, y1: r.y1 }); }
    else { split({ x0: r.x0, y0: r.y0, x1: r.x1, y1: sp - 1 }); split({ x0: r.x0, y0: sp + 1, x1: r.x1, y1: r.y1 }); }
  };
  for (const g of wings) {
    split({ x0: g.x0 + 1, y0: g.y0 + 1, x1: g.x1 - 1, y1: g.y1 - 1 });
    items.push({ t: "floor", x: g.x0 + 1, y: g.y0 + 1, w: g.x1 - g.x0 - 1, h: g.y1 - g.y0 - 1, kind: "tile" });
  }
  emitWalls(items, occ, wall, "build");
  // кто за дверью: номер комнаты, "small"/"big" — двор
  const roomAt = (x, y) => rooms.findIndex(r => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1);
  const side = (x, y, d) => { const k = roomAt(x, y); return k >= 0 ? k : d.kind.startsWith("out:") ? d.kind.slice(4) : -1; };
  const doorList = doors.map(d => ({ x: d.x, y: d.y, w: d.w, h: d.h,
    a: d.vert ? side(d.x - 1, d.y, d) : side(d.x, d.y - 1, d), b: d.vert ? side(d.x + 1, d.y, d) : side(d.x, d.y + 1, d) }));
  if (doors.filter(d => d.kind.startsWith("out:")).length < L.outsideDoors[0] || !doors.some(d => d.kind === "out:small") || !doors.some(d => d.kind === "out:big")) lc.meta.bad = "outsideDoors";
  // растения в комнатах, камни-мебель в больших комнатах (не у стен и дверей)
  const inRoom = (x, y, w, h) => rooms.some(r => x >= r.x0 && y >= r.y0 && x + w - 1 <= r.x1 && y + h - 1 <= r.y1);
  const big = rooms.filter(r => (r.x1 - r.x0 + 1) * (r.y1 - r.y0 + 1) >= L.bigRoom);
  place(bushCount(lc, L.bushes), genBush, 2, 2, 0, (x, y) => inRoom(x, y, 2, 2));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng), 1, 1, 2, (x, y) => big.some(r => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1));
  lc.meta.areas = { rooms: rooms.map(r => ({ x: r.x0, y: r.y0, w: r.x1 - r.x0 + 1, h: r.y1 - r.y0 + 1 })), doors: doorList };
}

// Арена: блок в середине, вокруг кольцо стен через 3 клетки с 3–4 проходами; у половины уровней ещё полукольцо
// снаружи (в свободном углу) с 2 проходами. Кусты — в коридоре кольца, деревья и камни — снаружи.
function arenaLayout(lc) {
  const { rng, ri, items, occ, reserve, isFree, place } = lc, L = CFG.LAYOUT.arena, D = L.ring + 1, bh = L.blockH, HG = L.halfGap;
  if (lc.homes.variant !== "diagonal") { lc.meta.bad = "homes"; return; }   // полукольцу нужны свободные углы (слева внизу / справа вверху)
  let half = rng() < L.halfRing;
  const corner = half ? (rng() < 0.5 ? "bl" : "tr") : null;
  // при полукольце кольцо сдвинуто от того края, где ему нужно место (2 клетки коридор + стена + 2 клетки)
  const by = corner === "bl" ? Math.floor((ROWS - bh) / 2) - 1 : corner === "tr" ? Math.floor((ROWS - bh) / 2) + 1 : Math.floor((ROWS - bh) / 2) + ri(-1, 1);
  let bw = ri(L.blockW[0], L.blockW[1]), bx = -1;
  for (; bw >= L.blockW[0] && bx < 0; bw--) {
    const opts = [];
    for (let x = D + 2; x + bw + D + 2 <= COLS; x++) if (isFree(x - D, by - D, bw + 2 * D, bh + 2 * D, 0)) opts.push(x);
    if (opts.length) { bx = opts[ri(0, opts.length - 1)]; break; }
  }
  if (bx < 0) { lc.meta.bad = "arena"; return; }
  const x0 = bx - D, y0 = by - D, x1 = bx + bw + D - 1, y1 = by + bh + D - 1;
  const wall = new Uint8Array(COLS * ROWS), at = (x, y) => y * COLS + x;
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < COLS && y < ROWS) wall[at(x, y)] = v; };
  for (let x = x0; x <= x1; x++) { set(x, y0, 1); set(x, y1, 1); }
  for (let y = y0; y <= y1; y++) { set(x0, y, 1); set(x1, y, 1); }
  // проходы в кольце: на разных сторонах, не у углов
  const gaps = [], n = ri(L.gaps[0], L.gaps[1]);
  for (const sd of shuffle(rng, ["top", "bottom", "left", "right"]).slice(0, n)) {
    const gw = ri(L.gapW[0], L.gapW[1]), horiz = sd === "top" || sd === "bottom";
    const st = horiz ? ri(x0 + 2, x1 - 1 - gw) : ri(y0 + 2, y1 - 1 - gw);
    const g = horiz ? { x: st, y: sd === "top" ? y0 : y1, w: gw, h: 1 } : { x: sd === "left" ? x0 : x1, y: st, w: 1, h: gw };
    for (let y = g.y; y < g.y + g.h; y++) for (let x = g.x; x < g.x + g.w; x++) set(x, y, 0);
    gaps.push(g);
  }
  // полукольцо: две «руки» через HG клеток от кольца — по левой и нижней стороне (bl) или по верхней и правой (tr);
  // снаружи от него тоже HG свободных клеток до края карты, и оно не задевает домики — иначе его нет
  const halfGaps = [];
  if (half) {
    const hx = corner === "bl" ? x0 - HG - 1 : x1 + HG + 1, hy = corner === "bl" ? y1 + HG + 1 : y0 - HG - 1;
    const mx = Math.floor((x0 + x1) / 2), my = Math.floor((y0 + y1) / 2);
    const vy0 = Math.min(my, hy), vy1 = Math.max(my, hy), hx0 = Math.min(mx, hx), hx1 = Math.max(mx, hx);
    const arm = [];
    for (let y = vy0; y <= vy1; y++) arm.push([hx, y]);
    for (let x = hx0; x <= hx1; x++) arm.push([x, hy]);
    half = arm.every(([x, y]) => x >= HG && y >= HG && x < COLS - HG && y < ROWS - HG && !occ[at(x, y)]);
    if (half) {
      for (const [x, y] of arm) set(x, y, 1);
      const gv = ri(L.gapW[0], L.gapW[1]), gvy = ri(vy0 + 1, vy1 - 1 - gv), gh = ri(L.gapW[0], L.gapW[1]), ghx = ri(hx0 + 1, hx1 - 1 - gh);
      for (let y = gvy; y < gvy + gv; y++) set(hx, y, 0);
      for (let x = ghx; x < ghx + gh; x++) set(x, hy, 0);
      halfGaps.push({ x: hx, y: gvy, w: 1, h: gv }, { x: ghx, y: hy, w: gh, h: 1 });
    }
  }
  emitWalls(items, occ, wall, "arena");
  items.push({ t: "wall", x: bx, y: by, w: bw, h: bh, kind: "arena" }); reserve(bx, by, bw, bh);
  // кусты — в коридоре внутри кольца; потом кольцо целиком занято, деревья и камни — снаружи
  place(bushCount(lc, L.bushes), genBush, 2, 2, 0, (x, y) => x > x0 && y > y0 && x + 1 < x1 && y + 1 < y1);
  reserve(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  place(ri(L.trees[0], L.trees[1]), genTree(rng));
  place(ri(L.rocks[0], L.rocks[1]), genRock(rng));
  lc.meta.areas = { block: [{ x: bx, y: by, w: bw, h: bh }], ring: [{ x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 }], gaps, halfGaps };
}

const LAYOUTS = {
  classic: classicLayout, meadow: meadowLayout, maze: mazeLayout, village: villageLayout,
  river: riverLayout, rooms: roomsLayout, arena: arenaLayout
};

// ---------- Сборка уровня ----------
function generateLevel(world, lv, attempt) {
  const type = levelType(world, lv), tier = levelTier(world, lv);
  const rng = mulberry32(levelSeed(world, lv) * 7919 + attempt * 104729 + 13);
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const items = [], occ = new Uint8Array(COLS * ROWS);
  const inb = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
  const reserve = (x, y, w, h) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (inb(xx, yy)) occ[yy * COLS + xx] = 1; };
  const isFree = (x, y, w, h, m) => {
    for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (!inb(xx, yy)) return false;
    for (let yy = y - m; yy < y + h + m; yy++) for (let xx = x - m; xx < x + w + m; xx++) if (inb(xx, yy) && occ[yy * COLS + xx]) return false;
    return true;
  };
  const hWall = (x1, x2, y, kind, gaps = []) => hWallTo(items, x1, x2, y, kind, gaps);
  const vWall = (x, y1, y2, kind, gaps = []) => vWallTo(items, x, y1, y2, kind, gaps);
  // n штук make(x, y) в свободных местах w×h с отступом m клеток от занятого
  const place = (n, make, w = 1, h = 1, m = 2, ok = null) => {
    let placed = 0;
    for (let k = 0; k < 500 && placed < n; k++) {
      const x = ri(0, COLS - w), y = ri(0, ROWS - h);
      if (isFree(x, y, w, h, m) && (!ok || ok(x, y))) { items.push(make(x, y)); reserve(x, y, w, h); placed++; }
    }
    return placed;
  };
  const lc = { lv, attempt, type, tier, rng, ri, items, occ, inb, reserve, isFree, hWall, vWall, place,
    small: null, bigPt: null, doors: { small: [], big: [] }, homes: null, meta: {} };

  // Домики: на 1-м уровне — как на рисунке (дом Большого слева внизу), иначе угол Большого выбирает сид
  placeHomes(lc, type === "classic" ? "side" : CFG.LAYOUT[type].homes || (rng() < 0.5 ? "diagonal" : "side"));
  LAYOUTS[type](lc);

  // Зеркалим карту для разнообразия (1-й уровень — как на рисунке)
  const fx = lv > 1 && rng() < 0.5, fy = lv > 1 && rng() < 0.5;
  const tx = (x, w) => fx ? COLS - x - w : x, ty = (y, h) => fy ? ROWS - y - h : y;
  for (const it of items) { const w = it.w || 1, h = it.h || 1; if (it.t === "bush") { it.x = tx(it.x, 2); it.y = ty(it.y, 2); } else { it.x = tx(it.x, w); it.y = ty(it.y, h); } }
  for (const it of items) if (it.exits) for (const e of it.exits) { e.x = tx(e.x, e.w); e.y = ty(e.y, e.h); }
  for (const list of Object.values(lc.meta.areas || {})) for (const r of list) { r.x = tx(r.x, r.w); r.y = ty(r.y, r.h); }
  const tp = ([x, y]) => [fx ? COLS - x : x, fy ? ROWS - y : y];
  // двери домиков (проём + направление наружу) — для правил честности
  const md = d => ({ x: tx(d.x, d.w), y: ty(d.y, d.h), w: d.w, h: d.h, dx: fx ? -d.dx : d.dx, dy: fy ? -d.dy : d.dy });
  const doors = { small: lc.doors.small.map(md), big: lc.doors.big.map(md) };
  const fl = [];
  for (let i = 0; i < 60; i++) fl.push({ x: rng() * W, y: rng() * H, c: ["#fff27a", "#ff9ecb", "#ffffff", "#b5e3ff"][ri(0, 3)] });
  return { type, items, small: lc.small.map(tp), big: tp(lc.bigPt), flowers: fl, doors, meta: lc.meta };
}

// Новое состояние мира здесь → добавить его в список keep у levelReport (и в __bb.worldState)
function applyWorld(gen) {
  obstacles = []; bushes = []; floors = []; decor = []; trees = []; safeZone = null; dangerZone = null;
  flowers = gen.flowers;
  for (const it of gen.items) {
    const px = it.x * CELL, py = it.y * CELL;
    if (it.t === "wall") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: true, kind: it.kind });
    else if (it.t === "cottage") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: true, kind: "cottage" });
    else if (it.t === "water") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: false, kind: "water" });
    else if (it.t === "pond") obstacles.push({ shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL, move: true, sight: false, kind: "pond", fountain: !!it.fountain });
    else if (it.t === "tree") { const t = { shape: "circle", x: px + 16, y: py + 16, r: 12, sr: 15, move: true, sight: true, kind: "tree", v: it.v, s: it.s }; obstacles.push(t); trees.push(t); }
    else if (it.t === "rock") obstacles.push({ shape: "circle", x: px + 16, y: py + 16, r: 16, sr: 16, move: true, sight: true, kind: "rock", s: it.s });
    else if (it.t === "bush") bushes.push({ x: px + CELL, y: py + CELL, r: 30 });
    else if (it.t === "safe") safeZone = { shape: "rect", x: px, y: py, w: it.w * CELL, h: it.h * CELL };
    else if (it.t === "danger") dangerZone = { x: px, y: py, w: it.w * CELL, h: it.h * CELL, exits: (it.exits || []).map(e => ({ x: (e.x + e.w / 2) * CELL, y: (e.y + e.h / 2) * CELL })) };
    else if (it.t === "floor") floors.push({ x: px, y: py, w: it.w * CELL, h: it.h * CELL, kind: it.kind, across: it.across });
    else if (it.t === "decor") decor.push({ x: px, y: py, w: it.w * CELL, h: it.h * CELL, kind: it.kind, c: it.c });
  }

function cleanWorld(v) {

  if (!v || typeof v !== "object") return out;
  const u = Math.floor(Number(v.unlocked));
  if (Number.isFinite(u)) out.unlocked = clamp(u, 1, max);
  if (v.stars && typeof v.stars === "object") for (const [k, x] of Object.entries(v.stars)) {
    const n = Number(k), st = Math.floor(Number(x));

}

function beep(f, dur, type = "square", vol = 0.06, delay = 0) {

  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// =====================================================================
//  УПРАВЛЕНИЕ: клавиатура, касания (джойстики), геймпад

const keys = new Set();
window.addEventListener("keydown", e => {
  if (nameInput) return;                     // печатают имя: игровые клавиши (WASD, M, L, Esc…) не трогаем
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  initAudio();
  if (!keys.has(e.code)) onKey(e.code);
  keys.add(e.code);
});
window.addEventListener("keyup", e => keys.delete(e.code));
window.addEventListener("blur", () => { keys.clear(); sticks.clear(); });
window.addEventListener("contextmenu", e => e.preventDefault());

function onKey(code) {
  if (code === "KeyM") { muted = !muted; return; }
  if (code === "KeyL") { setLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]); return; }
  if (mode === "menu") {
    if (code === "Digit1" || code === "Numpad1") startGame(1);
    if (code === "Digit2" || code === "Numpad2") startGame(2);
    if (code === "ArrowLeft") changeLevel(-1);
    if (code === "ArrowRight") changeLevel(1);
    if (code === "ArrowUp") cycleWorld(-1);       // миры (SPEC-006)
    if (code === "ArrowDown") cycleWorld(1);
  } else if (mode === "shop") {
    if (code === "Enter" || code === "Escape" || code === "Space") mode = "menu";
  } else if (mode === "skins") {
    if (code === "KeyR") randomOutfit("p1");
    if (code === "Enter" || code === "Escape" || code === "Space") mode = "menu";
  } else if (mode === "names") {
    if (code === "Enter" || code === "Escape" || code === "Space") mode = "skins";
  } else if (mode === "play") {
    if (code === "KeyP" || code === "Escape") mode = "pause";
    const kp = kissKeyPlayer(code);
    if (kp >= 0) throwKiss(kp);
  } else if (mode === "pause") {
    if (code === "KeyP" || code === "Escape") mode = "play";
    if (code === "KeyQ") toMenu();
  } else if (mode === "win") {
    if (code === "Enter" || code === "Space") nextLevel();
    if (code === "Escape" || code === "KeyQ") toMenu();
  } else if (mode === "lose") {
    if (code === "Enter" || code === "Space") startGame(numPlayers);
    if (code === "Escape" || code === "KeyQ") toMenu();
  }
}

// Воздушный поцелуй: один игрок — E или пробел; двое — игрок 1 E, игрок 2 Enter
function kissKeyPlayer(code) {
  if (code === "KeyE") return 0;
  if (numPlayers === 1) return code === "Space" ? 0 : -1;
  return code === "Enter" || code === "NumpadEnter" ? 1 : -1;
}

// Касания: левая половина — игрок 1, правая — игрок 2 (в игре на одного — весь экран)
const sticks = new Map();
const chipName = l => numPlayers === 1 ? L().me : String(l.id + 1);   // короткая метка игрока в кружке HUD
const STICK_R = 55;
// радиус джойстика в UI px: на телефоне — PHONE_STICK_R в CSS px (под палец), иначе как было
const stickR = () => PHONE ? CFG.PHONE_STICK_R * UW / CSS_W : STICK_R;
function toGame(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * UW / rect.width, y: (e.clientY - rect.top) * UH / rect.height };
}
const hitButton = p => buttons.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
let pendingUp = null;   // кнопка, которая срабатывает на отпускании (поле имени: iOS даёт фокус только в pointerup/click)
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  initAudio();
  if (nameInput) { closeNameInput(true); return; }   // тап мимо поля — имя сохраняется
  const p = toGame(e);
  const hit = hitButton(p);
  if (hit && hit.onUp) { pendingUp = { id: hit.id, pointerId: e.pointerId }; return; }
  if (hit) { hit.act(); return; }
  if (mode === "play" && e.pointerType !== "mouse") {
    if (PHONE && p.x > UW * CFG.STICK_ZONE) return;   // телефон: справа — только кнопки
    const player = numPlayers === 2 && p.x > UW / 2 ? 1 : 0;
    for (const [id, s] of sticks) if (s.player === player) sticks.delete(id);
    sticks.set(e.pointerId, { player, ox: p.x, oy: p.y, x: p.x, y: p.y });
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }

});
canvas.addEventListener("pointermove", e => {
  const s = sticks.get(e.pointerId);
  if (!s) return;
  const p = toGame(e);
  s.x = p.x; s.y = p.y;
  const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy);
  const R = stickR();
  if (d > R * 1.6) { s.ox = s.x - dx / d * R * 1.6; s.oy = s.y - dy / d * R * 1.6; }  // джойстик «едет» за пальцем
});
const endStick = e => sticks.delete(e.pointerId);
canvas.addEventListener("pointerup", e => {

  const pu = pendingUp; pendingUp = null;
  if (!pu || pu.pointerId !== e.pointerId) return;
  const hit = hitButton(toGame(e));
  if (hit && hit.id === pu.id) hit.act();              // тот же жест — фокус в поле, клавиатура на iOS открывается
});
canvas.addEventListener("pointercancel", endStick);

// Поле ввода имени: HTML <input> ровно поверх прямоугольника на холсте (rect в логических пикселях)
let nameInput = null;   // { el, slot, rect }
function placeNameInput() {
  if (!nameInput) return;
  const k = CSS_W / UW, r = nameInput.rect;
  Object.assign(nameInput.el.style, { left: r.x * k + "px", top: r.y * k + "px", width: r.w * k + "px", height: r.h * k + "px", fontSize: Math.max(CFG.PHONE_TEXT.input, r.h * k * 0.5) + "px" });
}
function openNameInput(rect, slot) {
  closeNameInput(true);
  const el = document.createElement("input");
  el.type = "text"; el.className = "name-input"; el.maxLength = CFG.NAME_MAX * 2; el.value = nameFor(slot);   // эмодзи — 2 знака UTF-16; cleanName режет до NAME_MAX
  el.setAttribute("enterkeyhint", "done"); el.setAttribute("autocapitalize", "words"); el.setAttribute("autocomplete", "off"); el.spellcheck = false;
  nameInput = { el, slot, rect };

// Геймпады
let pads = [];
const padPrev = [];
function pollPads() {
  const list = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : [];
  pads = list.map((p, i) => {
    const btn = p.buttons.map(b => b.pressed);
    const prev = padPrev[i] || [];
    for (const b of [0, 1, 2, 3, 9, 14, 15]) if (btn[b] && !prev[b]) onPadButton(b, i);
    padPrev[i] = btn;
    let x = p.axes[0] || 0, y = p.axes[1] || 0;
    if (Math.hypot(x, y) < 0.25) { x = 0; y = 0; }
    if (btn[14]) x = -1; if (btn[15]) x = 1; if (btn[12]) y = -1; if (btn[13]) y = 1;
    return { x, y };
  });
}
function onPadButton(b, pad = 0) {
  if (nameInput) return;
  initAudio();
  if (mode === "menu") {
    if (b === 0) startGame(1);
    if (b === 2 || b === 3) startGame(2);
    if (b === 14) changeLevel(-1);
    if (b === 15) changeLevel(1);
    if (b === 12) cycleWorld(-1);                  // крестовина ↑/↓ — миры (SPEC-006)
    if (b === 13) cycleWorld(1);
    if (b === 1) mode = "skins";
  } else if (mode === "shop") {
    if (b === 0 || b === 1 || b === 9) mode = "menu";
  } else if (mode === "skins") {
    if (b === 2) randomOutfit("p1");
    if (b === 3 && !PHONE) randomOutfit("p2");   // на телефоне игрока 2 нет
    if (b === 0 || b === 1 || b === 9) mode = "menu";
  } else if (mode === "names") {
    if (b === 0 || b === 1 || b === 9) mode = "skins";
  } else if (mode === "play") {
    if (b === 9) mode = "pause";
    if (b === CFG.PAD_KISS && (numPlayers === 1 || pad < numPlayers)) throwKiss(numPlayers === 1 ? 0 : pad);
  }
  else if (mode === "pause") { if (b === 9 || b === 0) mode = "play"; if (b === 1) toMenu(); }
  else if (mode === "win") { if (b === 0 || b === 9) nextLevel(); if (b === 1) toMenu(); }
  else if (mode === "lose") { if (b === 0 || b === 9) startGame(numPlayers); if (b === 1) toMenu(); }
}

function inputFor(l) {
  const pi = l.id;
  let x = 0, y = 0;
  const c = l.controls, pressed = arr => arr.some(k => keys.has(k));
  x += (pressed(c.right) ? 1 : 0) - (pressed(c.left) ? 1 : 0);
  y += (pressed(c.down) ? 1 : 0) - (pressed(c.up) ? 1 : 0);
  pads.forEach((p, i) => { if (numPlayers === 1 || i === pi) { x += p.x; y += p.y; } });
  for (const s of sticks.values()) {
    if (s.player !== pi) continue;
    const R = stickR(), dx = (s.x - s.ox) / R, dy = (s.y - s.oy) / R;
    if (Math.hypot(dx, dy) > 0.15) { x += dx; y += dy; }
  }
  const d = Math.hypot(x, y);
  if (d > 1) { x /= d; y /= d; }
  return { x, y };
}

function popText(x, y, text, color) { texts.push({ x, y, text, color, t: 0 }); }

function canSee(l) {

  if (l.fx && l.fx.cloak > 0) return false;   // невидимка          // в домике Большой не видит и не трогает
  const dx = l.x - big.x, dy = l.y - big.y, d = Math.hypot(dx, dy);
  const diff = angDiff(big.dir, Math.atan2(dy, dx));
  if (d < big.r + l.r + 22 && diff < 1.9) return true;

}
const helps = (o, l) => o !== l && o.state === "ok" && dist(o, l) < o.r + l.r + 12;   // o стоит рядом с упавшим l и поднимает его
function push(t) {

  if (t.fx.shield > 0) {                   // щит спасает от одного толчка
    t.fx.shield = 0;
    t.kx = Math.cos(a) * 280; t.ky = Math.sin(a) * 280;
    big.pushCd = 0.9; big.noPush = CFG.PUSH_RECOVER;
    popText(t.x, t.y - 40, L().blocked, "#7dd3fc");
    burst(t.x, t.y, "star", "#7dd3fc", 14);
    SFX.shield();
    return;
  }
  t.state = "down"; t.downTimer = CFG.DOWN_TIME; t.rescue = 0; t.path = []; t.dangerT = 0;
  t.botWait = rand(CFG.BOT_RESCUE_DELAY[0], CFG.BOT_RESCUE_DELAY[1]);   // боты пойдут спасать чуть позже
  t.kx = Math.cos(a) * 360; t.ky = Math.sin(a) * 360;
  if (attackToken === t) attackToken = null;
  big.pushCd = 0.9;
  big.noPush = CFG.PUSH_RECOVER;          // передышка: какое-то время никого не толкает
  shake = 0.25;
  popText(t.x, t.y - 40, L().bang, "#ffcc00");

}
function hug(l, a) {
  let power = 1;

  const gl = l.kind === "player" ? gloveOf(l.id) : null;
  if (gl) { power = GLOVES[gl].power; progress.inv[gl]--; saveProgress(); }   // рукавицы: сразу 2–3 сердечка
  big.hp = Math.max(0, big.hp - power); big.hugCd = CFG.HUG_STUN + 0.3; big.stun = CFG.HUG_STUN; big.stunFace = a; big.flash = 0.3;
  big.stunTurn = Math.abs(normAng(a - big.dir)) / CFG.HUG_STUN;   // медленно поворачивается, пока в шоке

// ---------- Воздушные поцелуи: летят прямо, полсердечка, Большой краснеет ----------

  const p = { x: (cx + 0.5) * CELL, y: (cy + 0.5) * CELL };
  if (inSafe(p) || inDanger(p)) return false;
  if (dangerZone) {                                      // и не в стенах/дверях дома Большого, и не прямо перед ними
    const m = CFG.STAR_HOUSE_MARGIN * CELL, z = dangerZone;
    if (p.x > z.x - m && p.x < z.x + z.w + m && p.y > z.y - m && p.y < z.y + z.h + m) return false;
  }
  if (safeZone) {                                        // далеко от домика (от стен, значит и от любой двери)
    const dx = Math.max(safeZone.x - p.x, 0, p.x - safeZone.x - safeZone.w), dy = Math.max(safeZone.y - p.y, 0, p.y - safeZone.y - safeZone.h);
    if (Math.hypot(dx, dy) < CFG.STAR_MIN_FROM_HOME * CELL) return false;
  }
  return !items.some(it => cellIdx(it.x, it.y) === i) && !bonusStars.some(s => cellIdx(s.x, s.y) === i);
}
function spawnStar(x, y) {
  let p = null;
  if (typeof x === "number" && typeof y === "number") p = { x, y };   // для тестов: в заданной точке
  else {
    const spots = [];
    for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++) if (starSpotOk(cx, cy)) spots.push([cx, cy]);
    if (!spots.length) return null;
    const [cx, cy] = spots[Math.floor(Math.random() * spots.length)];
    p = { x: (cx + 0.5) * CELL, y: (cy + 0.5) * CELL };
  }
  const s = { id: ++starSeq, x: p.x, y: p.y, t: 0, life: CFG.STAR_LIFE };
  bonusStars.push(s);
  return s;
}
function updateStars(dt) {
  starCd -= dt;
  if (starCd <= 0) { if (bonusStars.length < CFG.STAR_MAX) spawnStar(); starCd = rand(CFG.STAR_EVERY[0], CFG.STAR_EVERY[1]); }
  for (const s of bonusStars) {
    s.t += dt;
    const l = littles.find(q => q.kind === "player" && canAct(q) && dist(q, s) < q.r + CFG.STAR_PICK);
    if (!l) continue;
    s.t = s.life;
    stats.starCoins += CFG.STAR_COINS;
    progress.coins += CFG.STAR_COINS; saveProgress();   // сразу в копилку: остаются, даже если уровень не выигран
    popText(s.x, s.y - 30, "+" + CFG.STAR_COINS, "#fde047");
    burst(s.x, s.y, "star", "#fde047", 16);
    SFX.star();
  }
  bonusStars = bonusStars.filter(s => s.t < s.life);
}

function updateItems(dt) {
  itemCd -= dt;
  if (itemCd <= 0) { if (items.length < CFG.ITEM_MAX) spawnItem(); itemCd = rand(CFG.ITEM_EVERY[0], CFG.ITEM_EVERY[1]); }
  for (const l of littles) for (const k of ["boots", "cloak", "shield"]) l.fx[k] = Math.max(0, l.fx[k] - dt);
  for (const it of items) {
    it.t += dt;
    if (it.kind === "banana") {
      if (big.slip <= 0 && big.stun <= 0 && dist(big, it) < big.r + 8) {
        it.t = 999;
        big.slip = CFG.SLIP_STUN; big.path = []; big.flash = 0.2;
        popText(big.x, big.y - 70, L().slip, "#fde047");
        burst(big.x, big.y, "star", "#fde047", 12);
        shake = 0.2;
        SFX.slip();
      }
      continue;
    }
    const l = littles.find(q => q.state === "ok" && q.hugAnim <= 0 && dist(q, it) < q.r + 16);
    if (l) {
      it.t = 999;
      l.fx[it.kind] = it.kind === "boots" ? CFG.BOOTS_TIME : it.kind === "cloak" ? CFG.CLOAK_TIME : CFG.SHIELD_TIME;
      popText(l.x, l.y - 40, L().items[it.kind], "#c4b5fd");
      burst(l.x, l.y, "star", "#fde047", 10);

}

function updatePlayers(dt) {
  for (const l of littles) {
    if (l.kind !== "player") continue;
    l.moving = false;
    if (!canAct(l)) continue;
    const v = inputFor(l), m = Math.hypot(v.x, v.y);
    if (m > 0.05) {
      const sp = CFG.PLAYER_SPEED * (l.fx.boots > 0 ? CFG.BOOTS_MULT : 1);
      moveEntity(l, v.x * sp, v.y * sp, dt);
      l.dir = Math.atan2(v.y, v.x);
      l.walk += dt * 12 * m;
      l.moving = true;
    }
  }
}

function fleePoint(b) {
  if (safeZone) {                        // домик рядом — бежим в домик
    const home = { x: safeZone.x + safeZone.w / 2, y: safeZone.y + safeZone.h / 2 };
    if (dist(b, home) < 260) return home;
  }
  const away = Math.atan2(b.y - big.y, b.x - big.x);
  for (const k of [0, 0.6, -0.6, 1.2, -1.2, 1.8, -1.8]) {
    const a = away + k;
    const x = clamp(b.x + Math.cos(a) * 140, 20, W - 20), y = clamp(b.y + Math.sin(a) * 140, 20, H - 20);
    if (!moveSolidAt(x, y) && reachable[cellIdx(x, y)] && !inCone(x, y) && !inDangerXY(x, y)) return { x, y };   // не за водой и не в «кармане»
  }
  return freePointNear({ x: clamp(b.x + Math.cos(away) * 140, 20, W - 20), y: clamp(b.y + Math.sin(away) * 140, 20, H - 20) });
}

// Боты: 1) спасают упавших (сначала игроков), 2) убегают, если их видят,
//       3) по очереди подкрадываются сзади, остальные ждут неподалёку
function updateBots(dt) {
  const bots = littles.filter(l => l.kind === "bot" && canAct(l));
  const downed = littles.filter(l => l.state === "down" && l.botWait <= 0)   // боты ждут BOT_RESCUE_DELAY после падения
    .sort((a, b) => ((a.kind === "player" ? 0 : 1) - (b.kind === "player" ? 0 : 1)) || (a.downTimer - b.downTimer));
  const free = new Set(bots), rescueTarget = new Map();
  for (const d of downed) {
    let best = null, bd = Infinity;
    for (const b of free) { const dd = dist(b, d); if (dd < bd) { bd = dd; best = b; } }
    if (best) { free.delete(best); rescueTarget.set(best, d); }
  }
  if (attackToken && (attackToken.state !== "ok" || !free.has(attackToken))) attackToken = null;

  for (const l of littles) if (l.kind === "bot") l.moving = false;
  botAttackCd -= dt;
  for (const b of bots) {
    b.fleeT = Math.max(0, b.fleeT - dt);
    b.lurkT = Math.max(0, b.lurkT - dt);
    b.fleeRe -= dt;
    const seen = big.stun <= 0 && big.slip <= 0 && big.noPush <= 0 && big.blush <= 0 && canSee(b);
    const speed = CFG.BOT_SPEED * (b.fx.boots > 0 ? CFG.BOOTS_MULT : 1);
    let moved = false;

    if (b.dangerT > CFG.BOT_DANGER_LEAVE && dangerZone) {   // засиделся в доме Большого — к ближайшей двери
      b.task = "leave";
      const ex = nearestExit(b);
      moved = steerTo(b, ex.x, ex.y, speed, dt, false);
    } else if (big.slip > 0 && !rescueTarget.has(b) && dist(b, big) < 320) {   // Большой упал — бежим обнимать!
      b.task = "attack";
      moved = steerTo(b, big.x, big.y, speed, dt, false);
    } else if (rescueTarget.has(b) && !(seen && dist(b, big) < 90)) {
      const d = rescueTarget.get(b);
      b.task = "rescue";
      if (dist(b, d) > b.r + d.r + 4) moved = steerTo(b, d.x, d.y, speed, dt, false);
    } else {
      if (seen && b.fleeT <= 0) { b.fleeT = 1.0; b.fleeGoal = null; }
      if (seen) b.fleeT = Math.max(b.fleeT, 0.6);
      if (b.fleeT > 0) {
        b.task = "flee";
        if (attackToken === b) { attackToken = null; b.lurkT = rand(3, 6); }
        if (!b.fleeGoal || b.fleeRe <= 0 || dist(b, b.fleeGoal) < 15) { b.fleeGoal = fleePoint(b); b.fleeRe = 0.5; }
        moved = steerTo(b, b.fleeGoal.x, b.fleeGoal.y, speed, dt, false);
      } else {
        if (!attackToken && botAttackCd <= 0 && b.lurkT <= 0 && free.has(b)) { attackToken = b; b.tokenT = 8; }
        const back = big.dir + Math.PI;
        if (attackToken === b) {
          b.task = "attack";
          b.tokenT -= dt;
          if (b.tokenT <= 0) { attackToken = null; b.lurkT = rand(3, 6); }
          const a = back + b.offset;
          const rr = dist(b, big) > 95 ? 75 : big.r + b.r - 3;
          moved = steerTo(b, big.x + Math.cos(a) * rr, big.y + Math.sin(a) * rr, speed, dt, true);
        } else {
          b.task = "lurk";
          const g = lurkPoint(back + b.offset * 2.2);
          if (Math.hypot(g.x - b.x, g.y - b.y) > 20) moved = steerTo(b, g.x, g.y, speed * 0.8, dt, true);
        }
      }
    }
    b.moving = moved;
    if (moved) b.dir = turnToward(b.dir, b.moveDir, 10 * dt);
  }
  // один бот за раз и с паузой между попытками — чтобы главными героями были игроки
  if (prevToken && attackToken !== prevToken) botAttackCd = rand(CFG.BOT_ATTACK_PAUSE[0], CFG.BOT_ATTACK_PAUSE[1]);
  prevToken = attackToken;
}

// Где ждать боту: в 170 px за Большим, но не в его доме; точка в стене или за водой — ближайшая свободная клетка
function lurkPoint(a0) {
  for (const k of [0, 0.5, -0.5, 1, -1, 1.5, -1.5, 2, -2, 2.5, -2.5, Math.PI]) {
    const a = a0 + k, p = { x: clamp(big.x + Math.cos(a) * 170, 24, W - 24), y: clamp(big.y + Math.sin(a) * 170, 24, H - 24) };
    if (!inDanger(p)) return freePointNear(p);
  }
  return nearestExit(big);
}
function freePointNear(p) {
  const i = cellIdx(p.x, p.y);
  if (!blocked[i] && reachable[i] && !moveSolidAt(p.x, p.y)) return p;
  const c = freeCellNear(i);
  return { x: (c % COLS + 0.5) * CELL, y: (((c / COLS) | 0) + 0.5) * CELL };
}
// Ближайшая точка за дверью дома Большого
function nearestExit(p) {
  let best = null, bd = Infinity;
  for (const e of (dangerZone ? dangerZone.exits : [])) { const d = dist(p, e); if (d < bd) { bd = d; best = e; } }
  if (best) return best;
  const c = freeCellNear(cellIdx(p.x, p.y));             // дверей не знаем — ближайшая свободная клетка снаружи
  return { x: (c % COLS + 0.5) * CELL, y: (((c / COLS) | 0) + 0.5) * CELL };
}

function updateBig(dt) {
  big.flash = Math.max(0, big.flash - dt);
  big.hugCd = Math.max(0, big.hugCd - dt);
  big.moving = false;
  big.noPush = Math.max(0, big.noPush - dt);
  if (big.blush > 0) {                                   // покраснел: время идёт и пока лежит после банана
    big.blush = Math.max(0, big.blush - dt);
    if (big.blush <= 0 && big.slip <= 0 && big.stun <= 0) {   // прошло — поворачивается к тому, кто бросил, и в погоню
      const th = littles[big.blushBy] || littles[0];
      big.state = "chase"; big.lastSeen = { x: th.x, y: th.y };
      big.dir = Math.atan2(th.y - big.y, th.x - big.x); big.path = [];
      return;
    }
  }
  if (big.slip > 0) { big.slip -= dt; big.moving = false; if (big.slip <= 0) { big.state = "look"; big.timer = 0.8; } return; }
  if (big.stun > 0) { big.stun -= dt; big.dir = turnToward(big.dir, big.stunFace, big.stunTurn * dt); return; }
  if (big.blush > 0) return;                             // стоит красный и никого не толкает
  if (big.pushCd > 0) {
    big.pushCd -= dt;
    if (big.pushCd <= 0) { big.state = "look"; big.timer = Math.max(0.5, big.noPush); big.lookSign = Math.random() < 0.5 ? -1 : 1; }
    return;
  }

  const speed = bigSpeeds();
  let target = null, td = Infinity;
  for (const l of littles) {
    if (big.noPush > 0) break;               // отдыхает — никого не ловит
    if (l.state !== "ok" || l.invuln > 0 || l.dizzy > 0) continue;   // с кружащейся головой не трогает
    if (canSee(l)) { const d = dist(big, l); if (d < td) { td = d; target = l; } }
  }
  if (target) {
    if (big.state !== "chase") { popText(big.x, big.y - 75, "!", "#ff3b30"); SFX.alert(); }
    big.state = "chase";
    big.lastSeen = { x: target.x, y: target.y };
    big.moving = steerTo(big, target.x, target.y, speed.chase, dt, false);
    big.dir = turnToward(big.dir, Math.atan2(target.y - big.y, target.x - big.x), 7 * dt);
    if (td < big.r + target.r + 8) push(target);
    return;
  }
  if (big.state === "chase" || big.state === "search") {
    big.state = "search";
    big.moving = steerTo(big, big.lastSeen.x, big.lastSeen.y, speed.search, dt, false);
    if (big.moving) big.dir = turnToward(big.dir, big.moveDir, 6 * dt);
    if (!big.moving || dist(big, big.lastSeen) < 10) { big.state = "look"; big.timer = rand(1.5, 2.5); big.lookSign = Math.random() < 0.5 ? -1 : 1; }
    return;
  }
  if (big.state === "look") {
    big.dir += big.lookSign * 1.7 * dt;
    big.timer -= dt;
    if (big.timer <= 0) { big.state = "patrol"; big.goal = randomFreePoint(); big.path = []; big.repath = 0; big.patrolT = 10; }
    return;
  }
  if (!big.goal) { big.goal = randomFreePoint(); big.patrolT = 10; }
  big.patrolT -= dt;
  big.moving = steerTo(big, big.goal.x, big.goal.y, speed.patrol, dt, false);
  if (big.moving) big.dir = turnToward(big.dir, big.moveDir, 5 * dt);
  if (!big.moving || dist(big, big.goal) < 12 || big.patrolT <= 0) {
    big.state = "look"; big.timer = rand(1, 2.2); big.lookSign = Math.random() < 0.5 ? -1 : 1; big.goal = null;
  }
}

function separate() {
  const all = littles.filter(l => (l.state === "ok" || l.state === "down") && l.hugAnim <= 0);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.r + b.r;
    if (d >= min) continue;
    const am = a.state === "ok" ? 1 : 0, bm = b.state === "ok" ? 1 : 0, s = am + bm;
    if (!s) continue;
    const o = min - d;
    a.x -= dx / d * o * am / s; a.y -= dy / d * o * am / s;
    b.x += dx / d * o * bm / s; b.y += dy / d * o * bm / s;
    resolveWalls(a); resolveWalls(b);
  }
  for (const l of all) {
    const dx = l.x - big.x, dy = l.y - big.y, d = Math.hypot(dx, dy) || 0.01, min = l.r + big.r;
    if (d >= min) continue;
    if (l.state === "ok") { l.x += dx / d * (min - d); l.y += dy / d * (min - d); resolveWalls(l); }
    else { big.x -= dx / d * (min - d); big.y -= dy / d * (min - d); resolveWalls(big); }
  }
}
function checkContacts() {
  for (const l of littles) {
    if (mode !== "play") return;
    if (!canAct(l)) continue;   // голова кружится: не обнимает, толкнуть нельзя
    const dx = l.x - big.x, dy = l.y - big.y, d = Math.hypot(dx, dy);
    if (d > big.r + l.r + 4) continue;
    const a = Math.atan2(dy, dx), diff = angDiff(big.dir, a);
    if (diff > CFG.BEHIND_ANGLE || big.slip > 0) {                   // сзади — или Большой лежит после банана
      const wants = l.kind === "player" || l.task === "attack";   // боты обнимают только когда сами решили
      if (wants && big.hugCd <= 0 && l.hugCd <= 0 && big.stun <= 0) hug(l, a);
    }
    else if (diff < 1.9 && big.stun <= 0 && big.slip <= 0 && big.blush <= 0 && big.pushCd <= 0 && big.noPush <= 0 && l.invuln <= 0 && l.fx.cloak <= 0 && !inSafe(l)) push(l);
  }
}
function updateDowned(dt) {
  for (const l of littles) {
    if (l.state !== "down") continue;
    l.downTimer -= dt;
    l.botWait = Math.max(0, l.botWait - dt);
    const helper = littles.some(o => helps(o, l));
    l.rescue = helper ? l.rescue + dt : Math.max(0, l.rescue - CFG.RESCUE_DRAIN * dt);   // отошёл — прогресс тает
    if (l.rescue >= CFG.RESCUE_TIME) {
      l.state = "ok"; l.invuln = CFG.INVULN_AFTER_RESCUE; l.rescue = 0;
      popText(l.x, l.y - 40, L().saved, "#7CFC9A");
      burst(l.x, l.y - 10, "star", "#7CFC9A", 10);
      SFX.rescue();
    } else if (l.downTimer <= 0) {          // никто не помог — встаёт и хромает в домик отдыхать
      l.state = "home"; l.path = []; l.rescue = 0;
      l.restSpot = { ...spawns.small[l.id] };
      stats.rests++;
      if (attackToken === l) attackToken = null;
      popText(l.x, l.y - 40, L().out, "#e5e7eb");
      SFX.out();
    }
  }
}
// Дом Большого: кто в состоянии ok простоял внутри DANGER_TIME — вылетает за дверь, голова кружится (нога цела)
function updateDanger(dt) {
  for (const l of littles) {
    if (l.state !== "ok" || !inDanger(l)) { l.dangerT = 0; continue; }
    if (l.hugAnim > 0) continue;                            // на плечах у Большого — время стоит
    l.dangerT += dt;
    if (l.dangerT >= CFG.DANGER_TIME) throwOut(l);
  }
}
function throwOut(l) {
  const ex = nearestExit(l), c = freeCellNear(cellIdx(ex.x, ex.y));
  const p = c === cellIdx(ex.x, ex.y) && !moveSolidAt(ex.x, ex.y) ? ex : { x: (c % COLS + 0.5) * CELL, y: (((c / COLS) | 0) + 0.5) * CELL };
  l.x = p.x; l.y = p.y; l.kx = 0; l.ky = 0; l.path = []; l.fleeGoal = null;
  l.dangerT = 0; l.dizzy = CFG.DIZZY_TIME; l.moving = false;
  if (attackToken === l) attackToken = null;
  shake = 0.2;
  popText(l.x, l.y - 40, L().thrownOut, "#fca5a5");
  burst(l.x, l.y - 10, "star", "#fde047", 10);
  SFX.thrown();
}
// Ближайшая свободная клетка (не стена и не дом Большого), поиск в ширину
function freeCellNear(idx) {
  const seen = new Uint8Array(COLS * ROWS), q = [idx];
  seen[idx] = 1;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], cx = i % COLS, cy = (i / COLS) | 0;
    if (!blocked[i] && reachable[i] && !inDangerXY((cx + 0.5) * CELL, (cy + 0.5) * CELL)) return i;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      const j = ny * COLS + nx;
      if (!seen[j]) { seen[j] = 1; q.push(j); }
    }
  }
  return idx;
}
function updateResting(dt) {
  for (const l of littles) {
    if (l.state === "home") {
      l.moving = steerTo(l, l.restSpot.x, l.restSpot.y, CFG.HOME_SPEED, dt, false);
      if (l.moving) l.dir = turnToward(l.dir, l.moveDir, 8 * dt);
      if (!l.moving || dist(l, l.restSpot) < 6) { l.state = "rest"; l.restTimer = CFG.REST_TIME; l.moving = false; l.dir = Math.PI / 2; }
    } else if (l.state === "rest") {
      l.restTimer -= dt; l.moving = false;
      if (l.restTimer <= 0) {
        l.state = "ok"; l.invuln = 2; l.fleeT = 0;
        popText(l.x, l.y - 40, L().back, "#7CFC9A");
        burst(l.x, l.y - 10, "star", "#7CFC9A", 10);
        SFX.rescue();
      }
    }
  }
}
function updateFx(dt) {
  for (const t of texts) { t.t += dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.t < 1.2);
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
  particles = particles.filter(p => p.t < p.life);
  shake = Math.max(0, shake - dt);
}
function update(dt) {
  stats.time += dt;
  if (banner && (banner.t += dt) >= CFG.BANNER_TIME) banner = null;
  for (const l of littles) {
    l.invuln = Math.max(0, l.invuln - dt);
    l.hugCd = Math.max(0, l.hugCd - dt);
    l.dizzy = Math.max(0, l.dizzy - dt);
    l.kissCd = Math.max(0, l.kissCd - dt);
    if (l.hugAnim <= 0 && Math.abs(l.kx) + Math.abs(l.ky) > 5) {
      moveEntity(l, l.kx, l.ky, dt);
      const f = Math.exp(-7 * dt); l.kx *= f; l.ky *= f;
    } else { l.kx = 0; l.ky = 0; }
  }
  updatePlayers(dt);
  updateBots(dt);
  updateBig(dt);
  updateHugAnim(dt);
  updateKisses(dt);
  separate();
  checkContacts();
  updateDowned(dt);
  updateDanger(dt);
  updateResting(dt);
  updateItems(dt);
  updateStars(dt);
  updateFx(dt);

  const players = littles.filter(p => p.kind === "player");

}

// =====================================================================
//  2D-СЛОЙ: меню, HUD, подписи (поверх 3D)
// =====================================================================
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); }
function fillStroke(fill, lw = 3, stroke = OUT) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
function label(text, x, y, size, color, align = "center") {
  ctx.font = `900 ${size}px system-ui, "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = Math.max(3, size / 4.5); ctx.strokeStyle = OUT;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  if (PHONE) noteText("drawn", size);
}
function fitText(text, x, y, size, maxW, align, color, weight, min = 9) {
  let sz = size + 0.5;
  do { sz = Math.max(min, sz - 0.5); ctx.font = `${weight} ${sz}px system-ui, "Segoe UI", sans-serif`; } while (ctx.measureText(text).width > maxW && sz > min);
  ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  if (PHONE) noteText("drawn", sz);
  return sz;   // размер, которым написано
}
// Текст в несколько строк (по словам), не больше lines строк; не влезает — мельче
function wrapText(text, x, y, size, maxW, lines, color, weight) {
  let sz = size, rows = [];
  for (;;) {
    ctx.font = `${weight} ${sz}px system-ui, "Segoe UI", sans-serif`;
    rows = [];
    let cur = "";
    for (const wd of text.split(" ")) {
      const t = cur ? cur + " " + wd : wd;
      if (ctx.measureText(t).width > maxW && cur) { rows.push(cur); cur = wd; } else cur = t;
    }
    rows.push(cur);
    if ((rows.length <= lines && rows.every(r => ctx.measureText(r).width <= maxW)) || sz <= 9) break;
    sz -= 0.5;
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = color;
  const lh = sz * 1.25, y0 = y - (rows.length - 1) * lh / 2 + (lines - 1) * lh / 2;
  rows.forEach((r, i) => ctx.fillText(r, x, y0 + i * lh));
}
// Подпись с контуром, которая сжимается под ширину (не мельче 11px), а если не влезает — обрезается «…»
function labelFit(text, x, y, size, maxW, color, align = "center", min = 11) {
  const font = sz => `900 ${sz}px system-ui, "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif`;
  let sz = size;
  ctx.font = font(sz);
  while (ctx.measureText(text).width > maxW && sz > min) { sz = Math.max(min, sz - 0.5); ctx.font = font(sz); }
  let chars = Array.from(text);
  while (chars.length > 1 && ctx.measureText(text).width > maxW) { chars = chars.slice(0, -1); text = chars.join("").trimEnd() + "…"; }
  label(text, x, y, sz, color, align);
  return sz;
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
}
function drawCoin(x, y, r) {
  circle(x, y, r); fillStroke("#facc15", Math.max(1.5, r / 5));
  circle(x, y, r * 0.62); ctx.lineWidth = Math.max(1, r / 7); ctx.strokeStyle = "#ca8a04"; ctx.stroke();
  ctx.fillStyle = "#fff7c2"; circle(x - r * 0.35, y - r * 0.35, r * 0.2); ctx.fill();
}
function drawStar(x, y, r, filled) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr2 = k % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); fillStroke(filled ? "#facc15" : "rgba(255,255,255,.35)", Math.max(2, r / 7));
}
function drawMitten(x, y, s, kind) {
  const g = GLOVES[kind];
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 40, s / 40);
  rr(-14, -18, 28, 34, 13); fillStroke(g.color, 3);                       // ладошка
  ctx.save(); ctx.translate(-14, -2); ctx.rotate(-0.6); rr(-6, -10, 12, 18, 6); fillStroke(g.color, 3); ctx.restore();   // большой палец
  rr(-15, 12, 30, 10, 4); fillStroke(g.cuff, 3);                          // манжета
  if (kind === "mega") { heartPath(0, -10, 14); ctx.fillStyle = "#fff"; ctx.fill(); }
  else { ctx.fillStyle = "rgba(255,255,255,.8)"; for (const [dx, dy] of [[-5, -6], [5, -2], [-2, 5]]) { circle(dx, dy, 2); ctx.fill(); } }
  ctx.restore();
}
function drawHeart(x, y, s, fill, outline = true) { heartPath(x, y, s); ctx.fillStyle = fill; ctx.fill(); if (outline) { ctx.lineWidth = 2; ctx.strokeStyle = OUT; ctx.stroke(); } }
// Сердечко в полоске Большого: f = 1 целое, 0.5 половинка, 0 пустое
function drawHpHeart(x, y, s, f) {
  if (f <= 0 || f >= 1) { drawHeart(x, y, s, f >= 1 ? "#ff3b5c" : "#e5e7eb"); return; }
  heartPath(x, y, s); ctx.fillStyle = "#e5e7eb"; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(x - s, y - 2, s, s + 4); ctx.clip();
  heartPath(x, y, s); ctx.fillStyle = "#ff3b5c"; ctx.fill();
  ctx.restore();
  heartPath(x, y, s); ctx.lineWidth = 2; ctx.strokeStyle = OUT; ctx.stroke();
}
// Воздушный поцелуй: розовые губки и сердечко (картинка в магазине и на кнопке)
function drawKiss(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 40, s / 40);
  ctx.beginPath();                                                        // губки
  ctx.moveTo(-17, 4);
  ctx.bezierCurveTo(-11, -9, -4, -9, 0, -4); ctx.bezierCurveTo(4, -9, 11, -9, 17, 4);
  ctx.bezierCurveTo(10, 15, -10, 15, -17, 4); ctx.closePath();
  fillStroke("#ff4d8d", 3);
  ctx.beginPath(); ctx.moveTo(-15, 4); ctx.quadraticCurveTo(0, 8, 15, 4); ctx.lineWidth = 2.5; ctx.strokeStyle = "#b8104f"; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.7)"; ellipse(-6, -3, 3.5, 1.8); ctx.fill();
  heartPath(14, -20, 13); fillStroke("#ff8fb8", 2.5);                    // летящее сердечко
  ctx.restore();
}

// Подписи над 3D-героями (имена, таймеры, SOS, значки Большого)

}

function drawFx() {

// ---------- Общие тексты HUD (компьютер и телефон) ----------
const timerText = () => { const s = Math.floor(stats.time); return `${L().lvShort} ${level}  ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
// кружок команды: секунды до «домой» у упавшего, «z» у отдыхающего, иначе метка игрока или бота
const chipText = l => l.state === "down" ? String(Math.ceil(l.downTimer)) : l.state === "home" || l.state === "rest" ? "z" : l.kind === "player" ? chipName(l) : L().botChip;

// ---------- Телефон (SPEC-005): размеры в CSS px, крупный HUD ----------
// CSS px → UI px: на телефоне кнопки и шрифты задаются в CSS px (под палец), рисуем в UI px
const cpx = n => n * UW / CSS_W;
const minPx = cat => cpx(CFG.PHONE_TEXT[cat]);   // самый мелкий текст этого вида в UI px
// самый мелкий шрифт за кадр (UI px): по видам (title/main/hint) и всего нарисованного (drawn); где была надпись уровня
let textSizes = {}, bannerRect = null, rotateShown = false;
const noteText = (cat, s) => { if (!(s >= textSizes[cat])) textSizes[cat] = s; };
// размер текста: на компьютере как задан; на телефоне не мельче PHONE_TEXT[cat] CSS px (записывается там, где рисуется)
function fz(size, cat) {
  if (!PHONE) return size;
  const s = Math.max(size, minPx(cat));
  noteText(cat, s);
  return s;
}
const hudFont = sz => `900 ${sz}px system-ui, "Segoe UI", "Arial Rounded MT Bold", Arial, sans-serif`;
// геометрия верхней полосы и кружков команды телефона (их же обходят камера и стрелки)
const phoneTopBar = () => cpx(6) + cpx(CFG.PHONE_BTN_MIN);
function teamRect() {
  const mm = minimapRect(), cd = cpx(30), cw = cd + cpx(3), w = littles.length * cw + cpx(10), h = cd + cpx(8);
  return { x: mm.x + mm.w - w, y: mm.y + mm.h + cpx(CFG.PHONE_BTN_GAP), w, h, cd, cw };
}
// места экрана, где героя не видно: верхняя полоса и угол мини-карты с кружками (pad — запас);
// sides — ещё полосы у левого и правого края (для камеры: герой с именем целиком на экране)
function phoneOccluders(pad = 0, sides = 0) {
  const mm = minimapRect(), tr = teamRect(), top = phoneTopBar();
  // ways — куда камере уводить героя из-под этого места, по порядку: сначала первый, второй — когда первый упёрся
  const r = [{ x: -1e4, y: -1e4, w: 2e4, h: 1e4 + top + pad, ways: ["down"] },
    { x: mm.x - pad, y: -1e4, w: 2e4, h: 1e4 + tr.y + tr.h + pad, ways: ["down", "left"] }];
  if (sides) r.push({ x: -1e4, y: -1e4, w: 1e4 + sides, h: 2e4, ways: ["right"] }, { x: UW - sides, y: -1e4, w: 2e4, h: 2e4, ways: ["left"] });
  return r;
}
// верхняя полоса телефона: слева имя Большого и сердечки, дальше уровень/время, пауза, «во весь экран»;
// справа сверху мини-карта, под ней кружки команды; внизу справа 💋 и рядом рукавицы
function drawHUDPhone(t) {
  if (mode === "win" || mode === "lose") return;   // итоги — свой экран
  const m = cpx(8), gap = cpx(CFG.PHONE_BTN_GAP), bh = cpx(CFG.PHONE_BTN_MIN), top = cpx(6), pad = cpx(10);
  const mm = minimapRect(), main = minPx("main"), hint = minPx("hint");
  const plate = (id, x, y, w, h) => { rr(x, y, w, h, cpx(14)); fillStroke("rgba(255,255,255,.85)", 3); hudRects.push({ id, x, y, w, h }); };
  // уровень и время + кнопки
  const timeTxt = timerText();
  ctx.font = hudFont(main);
  const tw = ctx.measureText(timeTxt).width + 2 * pad, nBtn = STANDALONE ? 1 : 2, gw = tw + nBtn * (gap + bh);
  // имя Большого и сердечки: не влезает — сердечки плотнее, потом имя короче
  const bigName = nameFor("big"), room = mm.x - gap - m - gw - gap;
  let hStep = cpx(21), hSize = cpx(18), nameW = Math.min(ctx.measureText(bigName).width, cpx(110));
  const plateW = () => pad + nameW + pad * 0.6 + big.maxHp * hStep + pad * 0.4;
  if (plateW() > room) { hStep = Math.max(cpx(12), (room - pad * 2 - nameW) / big.maxHp); hSize = Math.min(hSize, hStep * 0.95); }
  if (plateW() > room) nameW = Math.max(cpx(36), room - pad * 2 - big.maxHp * hStep);
  const pw = plateW();
  plate("hearts", m, top, pw, bh);
  noteText("main", labelFit(bigName, m + pad, top + bh / 2, main, nameW, "#9b2c3a", "left", main));
  const hx = m + pad + nameW + pad * 0.6 + hStep / 2;
  for (let i = 0; i < big.maxHp; i++) drawHpHeart(hx + i * hStep, top + bh / 2 - hSize / 2 - 1, hSize, heartFill(i, big.hp));
  // группа по центру свободного места
  const gx = m + pw + Math.max(gap, (mm.x - gap - (m + pw) - gw) / 2);
  plate("timer", gx, top, tw, bh);
  noteText("main", fitText(timeTxt, gx + tw / 2, top + bh / 2 + 1, main, tw, "center", OUT, 900, main));
  addButton(gx + tw + gap, top, bh, bh, "II", "#64748b", () => { mode = "pause"; }, fz(main, "main"));
  if (!STANDALONE) addButton(gx + tw + gap + bh + gap, top, bh, bh, "⛶", "#64748b", toggleFullscreen, fz(main, "main"));
  // кружки команды под мини-картой
  const tr = teamRect();
  plate("team", tr.x, tr.y, tr.w, tr.h);
  littles.forEach((l, i) => {
    const cx = tr.x + cpx(5) + i * tr.cw + tr.cw / 2, cy = tr.y + tr.h / 2;
    ctx.globalAlpha = l.state === "home" || l.state === "rest" ? 0.45 : 1;
    circle(cx, cy, tr.cd / 2); fillStroke(l.state === "ok" ? l.look.shirt : "#9ca3af", 2.5);
    ctx.globalAlpha = 1;
    noteText("hint", labelFit(chipText(l), cx, cy, hint, tr.cd - cpx(4), l.state === "down" ? "#fecaca" : "#fff", "center", hint));

//  3D (Three.js): мультяшный стиль — toon-освещение + чёрный контур
// =====================================================================
const U = 1 / CELL;                       // 1 клетка логики = 1 единица 3D
const P = v => v * U;
const WALL_H = 0.85;
const glCanvas = document.getElementById("gl");
renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });

const LITTLE_SCALE = 1.6, BIG_SCALE = 1.4;   // герои крупнее клетки — так их лучше видно
const camTarget = new THREE.Vector3(COLS / 2, 0, ROWS / 2 + 0.4);
const camBase = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0xffffff, 0x5d7f45, 1.15));

sun.position.set(COLS / 2 - 9, 24, ROWS / 2 + 9);

sun.shadow.camera.updateProjectionMatrix();

// Камера: наклон сверху, вся карта помещается в кадр
const CAM_EL = 63 * Math.PI / 180, camDir = new THREE.Vector3(0, Math.sin(CAM_EL), Math.cos(CAM_EL));   // камера всегда смотрит под этим углом
function fitCamera() {
  const dir = camDir;
  const corners = [[0, 0, 0], [COLS, 0, 0], [0, 0, ROWS], [COLS, 0, ROWS], [0, WALL_H, 0], [COLS, WALL_H, 0]].map(c => new THREE.Vector3(...c));
  const v = new THREE.Vector3();
  for (let d = 12; d < 90; d += 0.2) {
    camera.position.copy(camTarget).addScaledVector(dir, d);
    camera.lookAt(camTarget); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    if (corners.every(c => { v.copy(c).project(camera); return Math.abs(v.x) <= 0.985 && v.y <= 0.9 && v.y >= -0.985; })) break;
  }
  camBase.copy(camera.position);
}
fitCamera();

// Видимая земля: углы кадра — лучи до земли (y = 0); из-за наклона это трапеция (дальний край шире).
// Направление камеры не меняется, поэтому углы = точка взгляда + расстояние × смещения (считаем их при расстоянии 1).
function groundCorners() {
  const D = 10, probe = new THREE.PerspectiveCamera(camera.fov, camera.aspect, 0.1, 500);
  probe.position.copy(camDir).multiplyScalar(D); probe.lookAt(0, 0, 0); probe.updateMatrixWorld(); probe.updateProjectionMatrix();
  const p = new THREE.Vector3(), r = new THREE.Vector3();
  return [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([nx, ny]) => {
    p.set(nx, ny, 0.5).unproject(probe); r.copy(p).sub(probe.position);
    const t = -probe.position.y / r.y;
    return { x: (probe.position.x + r.x * t) / D, z: (probe.position.z + r.z * t) / D };
  });
}
// габарит трапеции (в клетках от точки взгляда при расстоянии 1)
const cornersBox = cs => ({ x0: Math.min(...cs.map(c => c.x)), x1: Math.max(...cs.map(c => c.x)), z0: Math.min(...cs.map(c => c.z)), z1: Math.max(...cs.map(c => c.z)) });
const camLook = camTarget.clone();            // куда камера смотрит сейчас (на компьютере всегда центр карты)
let camDist = camBase.distanceTo(camTarget);  // расстояние от камеры до точки взгляда
let camCorners = groundCorners(), camOff = cornersBox(camCorners);
// видимая земля сейчас, в px мира: { x, y, w, h } — габарит трапеции
function camRect() {
  return { x: (camLook.x + camDist * camOff.x0) * CELL, y: (camLook.z + camDist * camOff.z0) * CELL,
    w: camDist * (camOff.x1 - camOff.x0) * CELL, h: camDist * (camOff.z1 - camOff.z0) * CELL };
}

// ---------- Камера телефона (SPEC-005): ближе, едет за героем, у краёв карты останавливается ----------
// cam.x/y — точка взгляда в режиме «за героем» (px мира), lax/lay — забегание вперёд (px),
// zoom: 0 — за героем, 1 — вся карта (меню, победа); dFollow/dFull — расстояния для этих двух видов.
const cam = { x: W / 2, y: H / 2, lax: 0, lay: 0, zoom: 1, dFollow: camDist, dFull: camDist, full: camTarget.clone() };
const camHero = () => littles.find(l => l.kind === "player") || null;
// оси камеры тени (как в three.js: смотрит от солнца на цель, «верх» — +y); смещение солнца от цели постоянно

      const off = m.deco === "bumps" || m.deco === "snow" ? k + 0.5 : k;

    }

function paintGround(place) {
  const th = THEMES[place], saved = ctx;
  ctx = groundCanvas.getContext("2d");
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = th.g1; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = th.g2;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  if (place === "school") {                              // разметка на асфальте и классики
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 4;
    ctx.strokeRect(9 * CELL, 6 * CELL, 9 * CELL, 8 * CELL);
    ctx.beginPath(); ctx.moveTo(13.5 * CELL, 6 * CELL); ctx.lineTo(13.5 * CELL, 14 * CELL); ctx.stroke();
    circle(13.5 * CELL, 10 * CELL, 1.4 * CELL); ctx.stroke();
    for (let k = 0; k < 6; k++) {
      const x = 8 * CELL + k * 26, y = 17.2 * CELL;
      ctx.fillStyle = k % 2 ? "#fde68a" : "#fca5a5"; ctx.fillRect(x, y, 24, 24);
      ctx.fillStyle = "#475569"; ctx.font = "bold 14px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(k + 1), x + 12, y + 13);
    }

        ctx.fillStyle = c;
        if (i % 3 === 0) { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5 - Math.PI / 2, r = k % 2 ? 2.2 : 5; ctx.lineTo(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r); } ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(f.x, f.y, 3.5, Math.PI, 0); ctx.fill(); }
      } else if (place === "winter") {
        ctx.fillStyle = c; circle(f.x, f.y, 1.8); ctx.fill();
      } else {
        ctx.fillStyle = c;
        for (let k = 0; k < 4; k++) { circle(f.x + Math.cos(k * TAU / 4) * 2.5, f.y + Math.sin(k * TAU / 4) * 2.5, 2); ctx.fill(); }
        ctx.fillStyle = "#f59e0b"; circle(f.x, f.y, 1.6); ctx.fill();
      }

      const [base, stone] = th.square;
      ctx.fillStyle = base; ctx.fillRect(f.x, f.y, f.w, f.h);
      ctx.fillStyle = stone;
      for (let y = f.y + 6; y < f.y + f.h; y += 12) for (let x = f.x + 6 + ((y - f.y) / 12 % 2) * 6; x < f.x + f.w; x += 12) { circle(x, y, 4); ctx.fill(); }

    } else {

}
