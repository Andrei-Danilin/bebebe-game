<script>
  // SPEC-025 AC 7b: the start's own texts (the modules may not load at all, so not I18N): noWebGL, startFailed, tryAgain,
  // needsInternet, the file:// notice (SPEC-011 AC 6) — in bebebe-save's lang, else bebebe-lang, else the browser's language
  const BOOT_TEXT = {
    en: ["This device can't show the 3D game", "Something went wrong while starting the game", "Try again", "The 3D engine (three.js) needs an internet connection to load.", "Open the game from the website or run npm run serve"],
    es: ["Este dispositivo no puede mostrar el juego en 3D", "Algo salió mal al abrir el juego", "Probá de nuevo", "El motor 3D necesita internet.", "Abrí el juego desde la página o corré npm run serve"],
    pt: ["Este aparelho não consegue mostrar o jogo em 3D", "Algo deu errado ao abrir o jogo", "Tentar de novo", "O motor 3D precisa de internet.", "Abra o jogo pelo site ou rode npm run serve"],
    ru: ["Это устройство не может показать 3D-игру", "Что-то пошло не так при запуске игры", "Попробовать ещё раз", "Для 3D-движка нужен интернет.", "Откройте игру с сайта или запустите npm run serve"]
  };
  // window.__bbBoot: fail(kind) — the failed start's card in place of the progress bar; onError — set by src/client/errors.js
  // (until then errors wait in early); the first error handlers, before any module runs (AC 7)
  window.__bbBoot = (() => {
    let l = null;
    try { l = (JSON.parse(localStorage.getItem("bebebe-save")) || {}).lang; } catch (e) { /* no save */ }
    try { if (!BOOT_TEXT[l]) l = localStorage.getItem("bebebe-lang"); } catch (e) { /* no storage */ }
    if (!BOOT_TEXT[l]) l = (navigator.languages || [navigator.language]).map(x => String(x).slice(0, 2).toLowerCase()).find(x => BOOT_TEXT[x]) || "en";
    const [noWebGL, startFailed, tryAgain, needsInternet, fileNotice] = BOOT_TEXT[l], TEXT = { noWebGL, startFailed, needsInternet };
    const B = { lang: l, failed: null, early: [], onError: null, tryAgain };
    const add = (el, tag, id, text) => { const e = el.appendChild(document.createElement(tag)); e.id = id; e.textContent = text; return e; };
    B.fail = kind => {
      const el = document.getElementById("loading");
      if (window.__bbReady || B.failed || !el || !TEXT[kind] || location.protocol === "file:") return;   // file:: its own notice
      B.failed = kind; el.className = ""; el.textContent = "";
      add(el, "div", "start-failed", TEXT[kind]);
      if (kind === "startFailed") add(el, "button", "try-again", tryAgain).onclick = () => location.reload();
    };
    const report = (err, where) => { if (B.onError) B.onError(err, where); else B.early.push([err, where]); };
    addEventListener("error", e => {
      const t = e.target;
      // a game file did not load (the module graph never runs): the internet only when the browser says it is offline
      if (t && t.tagName === "SCRIPT") { if (!window.__bbReady) B.fail(navigator.onLine === false ? "needsInternet" : "startFailed"); return; }
      if (t && t !== window) return;                         // an image or another resource: not an error of the game
      if (!window.__bbReady) B.fail("startFailed");
      report(e.error || new Error(e.message), "error");
    }, true);
    // a rejection whose reason carries benign: true (a refused optional browser feature) is no error of the game (AC 7c)
    addEventListener("unhandledrejection", e => { if (e.reason && e.reason.benign) e.preventDefault(); else report(e.reason, "rejection"); });
    // three.js r187 needs WebGL2: probed here at once (a probe canvas, released), before the game's files load (boot() checks too)
    try { const g = document.createElement("canvas").getContext("webgl2"); if (!g) B.fail("noWebGL"); else { const x = g.getExtension("WEBGL_lose_context"); if (x) x.loseContext(); } } catch (e) { B.fail("noWebGL"); }
    const el = document.getElementById("loading");
    if (location.protocol === "file:" && el) { el.textContent = ""; add(el, "div", "file-notice", fileNotice); }
    return B;
  })();
</script>
